name: P11-G11 repair timeout fire status v2

on:
  push:
    branches:
      - work/p11-g11-timeout-enabled-acceptance
    paths:
      - .github/workflows/p11-g11-fire-status-fix-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g11-timeout-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Repair fire status diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bench/request-id-timeout/p11-g11-timeout-worker.mts')
          text = path.read_text()
          old = '''  if (response.status !== 504) {
            throw new Error(
              `${framework} timeout-fire diagnostic returned ${response.status}`,
            );
          }'''
          # Normalize indentation from YAML here-doc representation.
          old = old.replace('          ', '')
          # Exact source form fallback.
          exact = '''  if (response.status !== 504) {
    throw new Error(
      `${framework} timeout-fire diagnostic returned ${response.status}`,
    );
  }'''
          target = exact if text.count(exact) == 1 else old
          if text.count(target) != 1:
              raise SystemExit(f'fire assertion anchor count exact={text.count(exact)} normalized={text.count(old)}')
          new = '''  const expectedStatus = framework === "gelis" ? 503 : 504;
  if (response.status !== expectedStatus) {
    throw new Error(
      `${framework} timeout-fire diagnostic returned ${response.status}, expected ${expectedStatus}`,
    );
  }'''
          path.write_text(text.replace(target, new, 1))
          PY
          bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g11-timeout-worker.mts
          git diff --check
          bun run typecheck:bench
          bun run check
      - name: Commit repaired worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g11-timeout-worker.mts
          git commit -m "fix(bench): validate current Gelis timeout status"
          git push origin HEAD:work/p11-g11-timeout-enabled-acceptance
