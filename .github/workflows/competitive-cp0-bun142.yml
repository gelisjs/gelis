name: Competitive CP0 Bun 1.4.2 Compatibility

on:
  push:
    branches:
      - work/competitive-cp0-bun142

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact accepted production candidate
        uses: actions/checkout@v7
        with:
          ref: 1dd5f94cf0e9ad884ca44e537ee287587cd8baab

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify Bun identity
        shell: bash
        run: |
          test "$(bun --version)" = "1.4.2"
          bun --revision
          test "$(git rev-parse HEAD)" = "1dd5f94cf0e9ad884ca44e537ee287587cd8baab"
          test -z "$(git status --porcelain)"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run full accepted repository checks
        run: bun run check

      - name: Bun adapter HTTP smoke
        shell: bash
        run: |
          bun -e '
            import { Gelis } from "./src/index.ts";
            import { serve } from "./src/adapter/bun/index.ts";

            const app = new Gelis();
            app.get("/cp0", () => new Response("ok", {
              headers: { "content-type": "text/plain" },
            }));

            const server = serve(app, {
              hostname: "127.0.0.1",
              port: 3180,
              reusePort: false,
            });

            try {
              const response = await fetch("http://127.0.0.1:3180/cp0");
              const body = await response.text();

              if (response.status !== 200) {
                throw new Error(`Expected status 200, received ${response.status}`);
              }

              if (body !== "ok") {
                throw new Error(`Expected body ok, received ${JSON.stringify(body)}`);
              }
            } finally {
              await server.stop(true);
            }
          '
