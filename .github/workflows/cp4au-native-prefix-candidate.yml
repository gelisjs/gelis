name: CP4-AU Native Prefix Candidate

on:
  push:
    branches:
      - work/competitive-cp4au-native-prefix-check
    paths:
      - .github/workflows/cp4au-native-prefix-candidate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4au-native-prefix-check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate candidate
        run: python3 scripts/cp4au-native-prefix-check-patch.py

      - name: Format and validate
        run: |
          bunx prettier --write src/runtime/router.ts
          bun test test/runtime/router-secondary-fingerprint.test.ts
          bun run check

      - name: Commit candidate and clean temporary generator
        run: |
          rm .github/workflows/cp4au-native-prefix-candidate.yml
          rm scripts/cp4au-native-prefix-check-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts .github/workflows/cp4au-native-prefix-candidate.yml scripts/cp4au-native-prefix-check-patch.py
          git commit -m "perf(router): use native exact prefix check for collisions"
          git push origin HEAD:work/competitive-cp4au-native-prefix-check
