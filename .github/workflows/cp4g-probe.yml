name: CP4-G Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4g-request-url-dispatch-decomposition
    paths:
      - .cp4g-probe-trigger

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4g-request-url-dispatch-decomposition
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: CP4-G correctness probe only
        run: bun bench/runtime/cp4g-request-url-dispatch-acceptance.mts --probe-only
