name: CP3-R Run Transform

on:
  push:
    branches:
      - work/competitive-cp3r-production-shape-fingerprint

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'CP3R_TRANSFORM'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply candidate transform
        run: python3 .cp3r-transform.py

      - name: Format candidate source and freeze
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            src/runtime/router.ts \
            docs/benchmarks/competitive-cp3r-production-shape-fingerprint-freeze.md \
            --write

      - name: Run full repository quality gate
        run: bun run check

      - name: Commit candidate source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts docs/benchmarks/competitive-cp3r-production-shape-fingerprint-freeze.md
          git commit -m "perf(router): stage CP3-R fingerprint candidate"
          git push
