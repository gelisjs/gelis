name: CP4-Y Evidence Format

on:
  push:
    paths:
      - ".cp4y-format-trigger"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4y-direct-production-revalidation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format evidence
        run: bunx prettier --write docs/benchmarks/competitive-cp4x-local-authoritative.md
      - name: Commit evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp4x-local-authoritative.md
          git commit -m "bench(competitive): format CP4-X authoritative evidence"
          git push origin HEAD:work/competitive-cp4y-direct-production-revalidation
