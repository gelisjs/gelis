name: CP4-Z Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4z-mixed-static-first-generic-table
    paths:
      - .cp4z-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4z-mixed-static-first-generic-table
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-Z correctness probe only
        run: bun bench/runtime/cp4z-mixed-static-first-production-acceptance.mts --probe-only
