name: CP4-AQ1 format harness

on:
  push:
    branches:
      - work/competitive-cp4aq1-hardened-stability-calibration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4aq1-hardened-stability-calibration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Format CP4-AQ1 harness
        run: bunx prettier bench/runtime/cp4aq1-hardened-stability-calibration.mts --write
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4aq1-hardened-stability-calibration.mts
          git commit -m "style(competitive): format CP4-AQ1 harness"
          git push
