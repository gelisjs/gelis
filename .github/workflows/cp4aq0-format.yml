name: CP4-AQ0 format harness

on:
  push:
    branches:
      - work/competitive-cp4aq0-benchmark-stability-calibration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CP4-AQ0 harness
        run: bunx prettier bench/runtime/cp4aq0-benchmark-stability-calibration.mts --write

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4aq0-benchmark-stability-calibration.mts
          git commit -m "style(competitive): format CP4-AQ0 harness"
          git push origin HEAD:work/competitive-cp4aq0-benchmark-stability-calibration
