name: P11-G8 package type AOT candidate

on:
  push:
    branches:
      - work/p11-g8-package-types-aot

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply G8 package and AOT patch
        run: python scripts/p11-g8-package-types-aot-patch.py

      - name: Format candidate
        run: >-
          bunx prettier
          package.json
          src/tooling/aot-source-analyzer.ts
          src/runtime/flat-aot-managed-input.ts
          test/package/package-exports.test.ts
          test/package/portable/consumer.ts
          test/runtime/body-limit-aot.test.ts
          test/runtime/request-id-timeout-aot.test.ts
          bench/types/p11-g8-timeout-acceptance.mts
          --write

      - name: Run targeted G8 package and AOT gates
        run: |
          bun run typecheck:package:portable
          bun run test:package
          bun test test/runtime/body-limit-aot.test.ts test/runtime/request-id-timeout-aot.test.ts

      - name: Run G8 TypeScript scalability gate
        run: bun bench/types/p11-g8-timeout-acceptance.mts

      - name: Run full quality gates
        run: bun run check

      - name: Commit clean G8 candidate
        run: |
          git rm .github/workflows/p11-g8-candidate.yml
          git rm scripts/p11-g8-package-types-aot-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/tooling/aot-source-analyzer.ts src/runtime/flat-aot-managed-input.ts test/package/package-exports.test.ts test/package/portable/consumer.ts test/runtime/body-limit-aot.test.ts test/runtime/request-id-timeout-aot.test.ts bench/types/p11-g8-timeout-acceptance.mts
          git commit -m "feat(aot): preserve route timeout execution boundaries"
          git push origin HEAD:work/p11-g8-package-types-aot
