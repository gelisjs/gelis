name: CP4-AC Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4ac-production-z-ab-attribution
    paths:
      - .cp4ac-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: work/competitive-cp4ac-production-z-ab-attribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-AC correctness probe only
        run: bun bench/runtime/cp4ac-production-z-ab-attribution.mts --probe-only
