name: P11-G5 Application Timeout Candidate

on:
  push:
    branches:
      - work/p11-g5-application-timeout
    paths:
      - .github/workflows/p11-g5-application-timeout-candidate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply G5 application HTTP integration
        run: python scripts/p11-g5-application-timeout-patch.py

      - name: Format G5 files
        run: |
          bunx prettier --write src/runtime/application-http.ts src/timeout/application.ts src/timeout/index.ts src/timeout/route-policy.ts test/runtime/timeout-application.test.ts

      - name: Targeted timeout tests
        run: |
          bun test test/runtime/timeout-core.test.ts test/runtime/timeout-application.test.ts

      - name: Full quality gate
        run: bun run check

      - name: Commit candidate and remove temporary generator
        run: |
          git rm .github/workflows/p11-g5-application-timeout-candidate.yml scripts/p11-g5-application-timeout-patch.py
          git add src/runtime/application-http.ts src/timeout/application.ts src/timeout/index.ts src/timeout/route-policy.ts test/runtime/timeout-application.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(timeout): complete G5 application deadline boundary"
          git push origin HEAD:work/p11-g5-application-timeout
