name: CP4-AM Source Prepare

on:
  push:
    branches:
      - work/cp4am-ak-inline-all-fallback-source
    paths:
      - .cp4am-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/cp4am-ak-inline-all-fallback-source
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply AK + inline ALL table-miss fallback
        run: python .github/scripts/cp4am_inline_all_fallback.py
      - name: Format candidate source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(router): compose static mask with inline ALL fallback"
          git push origin HEAD:work/cp4am-ak-inline-all-fallback-source
