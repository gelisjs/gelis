name: CP4-G Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4g-request-url-dispatch-decomposition
    paths:
      - .cp4g-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4g-request-url-dispatch-decomposition
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Apply CP4-G source transform
        run: python .github/scripts/cp4g_request_url_dispatch.py

      - name: Format changed source
        run: bunx prettier --write src/app.ts

      - name: Full quality
        run: bun run check

      - name: Commit frozen source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf(app): normalize request URL router dispatch"
          git push origin HEAD:work/competitive-cp4g-request-url-dispatch-decomposition
