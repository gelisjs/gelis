name: Competitive CP1-A Prettier

on:
  push:
    branches:
      - diag/competitive-cp1a-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: work/competitive-cp1a-core-equivalence
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Format CP1-A evidence tree
        run: >-
          bunx prettier
          bench/competitive
          docs/benchmarks/competitive-cp1a-core-equivalence.md
          --write

      - name: Commit formatted tree
        shell: bash
        run: |
          if git diff --quiet -- bench/competitive docs/benchmarks/competitive-cp1a-core-equivalence.md; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "Rigent"
          git config user.email "127601320+rigenttio@users.noreply.github.com"
          git add bench/competitive docs/benchmarks/competitive-cp1a-core-equivalence.md
          git commit -m "style(competitive): format CP1-A evidence"
          git push origin HEAD:work/competitive-cp1a-core-equivalence
