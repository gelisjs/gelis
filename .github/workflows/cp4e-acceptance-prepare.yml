name: CP4-E Acceptance Prepare

on:
  push:
    branches:
      - work/competitive-cp4e-deferred-trailing-metadata

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4E_ACCEPTANCE_PREPARE_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4e-deferred-trailing-metadata
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prepare frozen CP4-E acceptance artifacts
        run: python3 cp4e-acceptance-transform.py
      - name: Format acceptance artifacts
        run: >-
          bunx prettier --write
          bench/runtime/cp4e-deferred-trailing-metadata-acceptance.mts
          bench/runtime/cp4e-deferred-trailing-metadata-worker.mts
          docs/benchmarks/competitive-cp4d-local-authoritative.md
          docs/benchmarks/competitive-cp4e-deferred-trailing-metadata-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen acceptance artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            bench/runtime/cp4e-deferred-trailing-metadata-acceptance.mts \
            bench/runtime/cp4e-deferred-trailing-metadata-worker.mts \
            docs/benchmarks/competitive-cp4d-local-authoritative.md \
            docs/benchmarks/competitive-cp4e-deferred-trailing-metadata-freeze.md
          git commit -m "bench(competitive): freeze CP4-E acceptance protocol"
          git push origin HEAD:work/competitive-cp4e-deferred-trailing-metadata
