name: CP4-K Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4k-static-only-handoff
    paths:
      - .cp4k-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4k-static-only-handoff
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-K correctness probe only
        run: bun bench/runtime/cp4k-static-only-handoff-acceptance.mts --probe-only
