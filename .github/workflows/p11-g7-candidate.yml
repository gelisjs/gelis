name: P11-G7 correctness composition candidate

on:
  push:
    branches:
      - work/p11-g7-correctness-composition

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply G7 owner registry patch
        run: python scripts/p11-g7-correctness-composition-patch.py

      - name: Format candidate
        run: bunx prettier src/app.ts test/runtime/p11-g7-correctness-composition.test.ts --write

      - name: Run targeted P11-G correctness tests
        run: >-
          bun test
          test/runtime/timeout-application.test.ts
          test/runtime/timeout-route.test.ts
          test/runtime/request-id-policy.test.ts
          test/runtime/request-id-application.test.ts
          test/runtime/p11-g7-correctness-composition.test.ts

      - name: Run full quality gates
        run: bun run check

      - name: Commit clean G7 candidate
        run: |
          git rm .github/workflows/p11-g7-candidate.yml
          git rm scripts/p11-g7-correctness-composition-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts test/runtime/p11-g7-correctness-composition.test.ts
          git commit -m "fix(runtime): enforce route boundary owner consistency"
          git push origin HEAD:work/p11-g7-correctness-composition
