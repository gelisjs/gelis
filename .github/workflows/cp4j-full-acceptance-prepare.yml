name: CP4-J Full Acceptance Prepare

on:
  push:
    branches:
      - work/competitive-cp4j-full-production-acceptance
    paths:
      - .cp4j-acceptance-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4j-full-production-acceptance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-J full acceptance artifacts
        run: python .github/scripts/cp4j_full_acceptance_prepare.py
      - name: Format changed artifacts
        run: bunx prettier --write bench/runtime/cp4j-full-production-acceptance.mts bench/runtime/cp4j-full-production-worker.mts docs/benchmarks/competitive-cp4j-full-production-freeze.md docs/benchmarks/competitive-cp4i-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen CP4-J artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4j-full-production-acceptance.mts bench/runtime/cp4j-full-production-worker.mts docs/benchmarks/competitive-cp4j-full-production-freeze.md docs/benchmarks/competitive-cp4i-local-authoritative.md
          git diff --cached --quiet && exit 0
          git commit -m "bench(competitive): freeze CP4-J full production acceptance"
          git push origin HEAD:work/competitive-cp4j-full-production-acceptance
