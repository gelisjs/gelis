name: CP4-AO Harness Prepare

on:
  push:
    branches:
      - work/competitive-cp4ao-all-only-production-acceptance
    paths:
      - .cp4ao-harness-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ao-all-only-production-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build frozen CP4-AO production acceptance harness
        run: python .github/scripts/cp4ao_build_production_acceptance.py
      - name: Format frozen artifacts
        run: bunx prettier --write bench/runtime/cp4ao-all-only-production-acceptance.mts bench/runtime/cp4ao-all-only-production-acceptance-worker.mts docs/benchmarks/competitive-cp4ao-all-only-production-acceptance-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4ao-all-only-production-acceptance.mts bench/runtime/cp4ao-all-only-production-acceptance-worker.mts docs/benchmarks/competitive-cp4ao-all-only-production-acceptance-freeze.md
          git commit -m "bench(cp4ao): freeze direct production acceptance"
          git push origin HEAD:work/competitive-cp4ao-all-only-production-acceptance
