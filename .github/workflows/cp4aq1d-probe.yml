name: CP4-AQ1D probe

on:
  push:
    branches:
      - work/competitive-cp4aq1d-result-file-ipc-stability-calibration

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun bench/runtime/cp4aq1d-hardened-stability-calibration.mts --probe-only
