name: CP4-AB Format Evidence

on:
  push:
    branches:
      - work/competitive-cp4ab-dead-routing-metadata-elimination

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, 'CP4AB_FORMAT_TRIGGER')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ab-dead-routing-metadata-elimination
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/benchmarks/competitive-cp4aa-local-authoritative.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp4aa-local-authoritative.md
          git commit -m "style(bench): format CP4-AA evidence"
          git push origin HEAD:work/competitive-cp4ab-dead-routing-metadata-elimination
