name: P11-G10 repair generator escaping

on:
  push:
    branches:
      - work/p11-g10-request-id-enabled-acceptance
    paths:
      - .github/workflows/p11-g10-repair-generator.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g10-request-id-enabled-acceptance
          fetch-depth: 0
      - name: Repair Python regex replacement escaping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p11-g10-generate-harness.yml')
          text = path.read_text()
          old = 'text, count = pattern.subn(replacement, text, count=1)'
          new = 'text, count = pattern.subn(lambda _match: replacement, text, count=1)'
          if old not in text:
              raise SystemExit('expected generator replacement anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repaired generator
        run: |
          rm .github/workflows/p11-g10-repair-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p11-g10-generate-harness.yml .github/workflows/p11-g10-repair-generator.yml
          git commit -m "fix(ci): preserve regex escapes in P11-G10 generator"
          git push origin HEAD:work/p11-g10-request-id-enabled-acceptance