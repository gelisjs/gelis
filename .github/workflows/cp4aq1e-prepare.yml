name: CP4-AQ1E prepare

on:
  push:
    branches:
      - work/competitive-cp4aq1e-split-main-memory-stability

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate AQ1E split calibration
        shell: python
        run: |
          from pathlib import Path
          import re

          old_h = Path('bench/runtime/cp4aq1d-hardened-stability-calibration.mts')
          old_w = Path('bench/runtime/cp4aq1d-hardened-stability-calibration-worker.mts')
          old_f = Path('docs/benchmarks/competitive-cp4aq1d-hardened-stability-calibration-freeze.md')

          main_h = Path('bench/runtime/cp4aq1e-main-stability-calibration.mts')
          main_w = Path('bench/runtime/cp4aq1e-main-stability-calibration-worker.mts')
          mem_h = Path('bench/runtime/cp4aq1e-memory-stability-calibration.mts')
          mem_w = Path('bench/runtime/cp4aq1e-memory-stability-calibration-worker.mts')
          freeze = Path('docs/benchmarks/competitive-cp4aq1e-split-main-memory-stability-freeze.md')

          base_h = old_h.read_text()
          base_w = old_w.read_text()

          def remove_launcher_probe(text: str, label: str) -> str:
              text = text.replace('const launcherProbeOnly = process.argv.includes("--launcher-probe");\n', '')
              text = text.replace('let launcherProbeCompleted = false;\n', '')
              text = re.sub(r'  \} else if \(launcherProbeOnly\) \{\n    runLauncherProbe\(\);\n    launcherProbeCompleted = true;\n', '', text, count=1)
              text = re.sub(r'\} else if \(launcherProbeCompleted\) \{\n  console\.log\(\);\n  console\.log\("' + re.escape(label) + r' WINDOWS LAUNCHER IPC PROBE: PASS \(16/16\)"\);\n', '', text, count=1)
              text = re.sub(r'  \} else if \(launcherProbeOnly\) \{.*?  \} else \{', '  } else {', text, count=1, flags=re.S)
              text = re.sub(r'function runLauncherProbe\(\): void \{.*?\n\}\n\nfunction runTiming\(\): void \{', 'function runTiming(): void {', text, count=1, flags=re.S)
              return text

          # MAIN: 10 hotpaths + registration, memory excluded.
          h = base_h.replace('CP4-AQ1D', 'CP4-AQ1E-MAIN').replace('cp4aq1d', 'cp4aq1e-main')
          h = h.replace('"cp4aq1e-main-hardened-stability-calibration-worker.mts"', '"cp4aq1e-main-stability-calibration-worker.mts"')
          h = re.sub(r'\n  \{\n    cell: "static-memory",\n    label: "static retained heap delta",\n    kind: "memory",\n  \},', '', h, count=1)
          h = remove_launcher_probe(h, 'CP4-AQ1E-MAIN')
          h = h.replace(
              '    console.log("Order:           4 A→B + 4 B→A pairs per block");',
              '    console.log("Order:           4 A→B + 4 B→A pairs per block");\n    console.log("Cells:           10 hotpath + 1 registration; memory isolated in AQ1E-MEMORY");',
          )
          h = h.replace(
              '  for (const spec of CELLS) {\n    const pairs: PairResult[] = [];\n\n    for (let block = 0; block < BLOCKS; block++) {',
              '  for (let cellIndex = 0; cellIndex < CELLS.length; cellIndex++) {\n    const spec = CELLS[cellIndex]!;\n    const pairs: PairResult[] = [];\n\n    for (let block = 0; block < BLOCKS; block++) {\n      console.log(`PROGRESS main ${cellIndex + 1}/${CELLS.length} ${spec.cell} block ${block + 1}/${BLOCKS}`);',
              1,
          )
          h = h.replace('AQ1 is environment/estimator calibration only; this readiness result does not reclassify Gelis source performance.', 'AQ1E-MAIN is environment/estimator calibration only; this readiness result does not reclassify Gelis source performance.')
          main_h.write_text(h)

          main_w.write_text(base_w.replace('CP4-AQ1D', 'CP4-AQ1E-MAIN').replace('cp4aq1d', 'cp4aq1e-main'))

          # MEMORY: dedicated amplified retained-heap experiment.
          mh = base_h.replace('CP4-AQ1D', 'CP4-AQ1E-MEMORY').replace('cp4aq1d', 'cp4aq1e-memory')
          mh = mh.replace('"cp4aq1e-memory-hardened-stability-calibration-worker.mts"', '"cp4aq1e-memory-stability-calibration-worker.mts"')
          mh = mh.replace('const PAIRS_PER_BLOCK = 8;', 'const PAIRS_PER_BLOCK = 4;')
          mh, count = re.subn(
              r'const CELLS: readonly CellSpec\[\] = \[.*?\n\];',
              'const CELLS: readonly CellSpec[] = [\n  {\n    cell: "static-memory",\n    label: "static retained heap bytes/router (32-router amplification)",\n    kind: "memory",\n  },\n];',
              mh,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('memory CELLS replacement failed')
          mh = remove_launcher_probe(mh, 'CP4-AQ1E-MEMORY')
          mh = mh.replace(
              '    console.log("Order:           4 A→B + 4 B→A pairs per block");',
              '    console.log("Order:           2 A→B + 2 B→A pairs per block");\n    console.log("Retained routers/sample: 32");\n    console.log("Metric:          retained heap bytes/router");',
          )
          mh = mh.replace(
              '  for (const spec of CELLS) {\n    const pairs: PairResult[] = [];\n\n    for (let block = 0; block < BLOCKS; block++) {',
              '  for (const spec of CELLS) {\n    const pairs: PairResult[] = [];\n\n    for (let block = 0; block < BLOCKS; block++) {\n      console.log(`PROGRESS memory ${spec.cell} block ${block + 1}/${BLOCKS}`);',
              1,
          )
          mh = mh.replace(
              '  return {\n    bias: 0.005,\n    ciRadius: 0.005,\n    orderSpread: 0.005,\n    blockDeviation: 0.005,\n  };',
              '  return {\n    bias: 0.01,\n    ciRadius: 0.015,\n    orderSpread: 0.01,\n    blockDeviation: 0.02,\n  };',
              1,
          )
          mh = mh.replace('HARDENED BENCHMARK 2%-GATE READINESS', 'HARDENED 5%-MEMORY-GATE READINESS')
          mh = mh.replace('AQ1 is environment/estimator calibration only; this readiness result does not reclassify Gelis source performance.', 'AQ1E-MEMORY is environment/estimator calibration only; this readiness result does not reclassify Gelis source performance.')
          mh = mh.replace('type Unit = "ns/op" | "ms" | "bytes";', 'type Unit = "ns/op" | "ms" | "bytes" | "bytes/router";')
          mem_h.write_text(mh)

          mw = base_w.replace('CP4-AQ1D', 'CP4-AQ1E-MEMORY').replace('cp4aq1d', 'cp4aq1e-memory')
          mw = mw.replace('const MIN_CALIBRATION_MS = 20;', 'const MIN_CALIBRATION_MS = 20;\nconst RETAINED_MEMORY_ROUTERS = 32;')
          mw = mw.replace('type Unit = "ns/op" | "ms" | "bytes";', 'type Unit = "ns/op" | "ms" | "bytes" | "bytes/router";')
          mw, count = re.subn(
              r'function staticMemoryCell\(Router: RouterConstructor\): PreparedCell \{.*?\n\}\n\nfunction buildStaticRoutes',
              '''function staticMemoryCell(Router: RouterConstructor): PreparedCell {\n  const routes = buildStaticRoutes();\n\n  return {\n    unit: "bytes/router",\n    assertCorrectness: () => {\n      const router = registerRoutes(Router, routes);\n      assertLastStaticMatch(router);\n    },\n    singleMeasure: () => {\n      {\n        const warmupRouter = registerRoutes(Router, routes);\n        assertLastStaticMatch(warmupRouter);\n      }\n      forceGc();\n      const before = process.memoryUsage().heapUsed;\n\n      const retained: RouterLike[] = [];\n      for (let index = 0; index < RETAINED_MEMORY_ROUTERS; index++) {\n        retained.push(registerRoutes(Router, routes));\n      }\n\n      forceGc();\n      const after = process.memoryUsage().heapUsed;\n      const match = assertLastStaticMatch(retained.at(-1)!);\n      const delta = after - before;\n      if (delta <= 0) {\n        throw new Error(`non-positive amplified static router heap delta: ${delta}`);\n      }\n      return {\n        metric: delta / RETAINED_MEMORY_ROUTERS,\n        sink: match.route.path.length + retained.length,\n      };\n    },\n  };\n}\n\nfunction buildStaticRoutes''',
              mw,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('memory worker replacement failed')
          mem_w.write_text(mw)

          freeze.write_text('''# CP4-AQ1E split main/memory benchmark stability calibration freeze\n\n## Purpose\n\nAQ1D proved the gated Windows launcher and synchronous result-file IPC, but its full run failed late because the single-router retained-heap cell produced a negative GC-adjusted delta. AQ1E prospectively separates normal performance stability from memory stability so a memory-methodology failure cannot discard completed hotpath work.\n\nNeither AQ1E experiment can reclassify CP4-AO, CP4-AP, or historical Gelis performance evidence.\n\n## Frozen identity\n\n- Bun `1.4.2`\n- revision `744846f844374847c902b5e7fd59b4342a51ef99`\n- source A = source B = `5d9698d6b8d368ddcff358fc2645435b93c0c062`\n- `5,000` routes\n- authoritative host: Windows, 12 logical CPUs\n- timed workers: logical CPU `10` / mask `0x400`, process priority `HIGH`\n- launch gate opens only after affinity and priority are applied\n- result transport: synchronous result-file IPC after measurement\n\n## AQ1E-MAIN\n\nExactly 11 cells: the 10 AQ1D hotpath cells plus static registration. Static memory is excluded. Their measurement kernels are unchanged from AQ1D.\n\n- `8` blocks\n- `8` mirrored pairs/block\n- `64` samples/source/cell\n- each block: `4 A→B` + `4 B→A`\n- `5,000` deterministic complete-block bootstrap resamples\n- estimator: `median(all B) / median(all A)`\n\nHotpath readiness, every cell: bias `<=1.00%`; bootstrap 95% CI inside `0.9850x–1.0150x`; order spread `<=1.00%`; max block deviation `<=2.00%`.\n\nRegistration readiness: bias `<=2.00%`; bootstrap 95% CI inside `0.9600x–1.0400x`; order spread `<=3.00%`; max block deviation `<=5.00%`.\n\nAll 11 must pass for `CP4-AQ1E-MAIN HARDENED BENCHMARK 2%-GATE READINESS: PASS`.\n\n## AQ1E-MEMORY\n\nDedicated retained-heap calibration. Each worker performs one unmeasured warmup router registration, lets that router become unreachable, forces GC, records baseline heap, then creates and retains **32** complete 5,000-route routers simultaneously, forces GC, and records final heap.\n\nMetric: `(after - before) / 32`, reported as `bytes/router`. Result-file writing occurs only afterward. A non-positive amplified total delta remains invalid and is never clamped.\n\n- `8` blocks\n- `4` mirrored pairs/block\n- `32` samples/source\n- each block: `2 A→B` + `2 B→A`\n- `5,000` deterministic complete-block bootstrap resamples\n- estimator: `median(all B) / median(all A)`\n\nProspective readiness for future 5% memory gates: bias `<=1.00%`; bootstrap 95% CI inside `0.9850x–1.0150x`; order spread `<=1.00%`; max block deviation `<=2.00%`.\n\nAll criteria must pass for `CP4-AQ1E-MEMORY HARDENED 5%-MEMORY-GATE READINESS: PASS`.\n\n## Interpretation contract\n\nAQ1E-MAIN and AQ1E-MEMORY are independent authoritative calibration experiments. A completed result from one remains valid if the other later aborts or fails. The first valid completed local timed run of each experiment is authoritative for that experiment. An abort before its completion marker is infrastructure/methodology failure, not readiness PASS/FAIL. Accepted correctness probes are never rerun. An unchanged completed FAIL is never rerun to seek a PASS. CP4-AQ remains paused until the hardened runner requirements are satisfied. Parent progress lines occur only between worker measurements and are outside all measured worker intervals.\n''')

          old_h.unlink()
          old_w.unlink()
          old_f.unlink()
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq1e-main-stability-calibration.mts bench/runtime/cp4aq1e-main-stability-calibration-worker.mts bench/runtime/cp4aq1e-memory-stability-calibration.mts bench/runtime/cp4aq1e-memory-stability-calibration-worker.mts docs/benchmarks/competitive-cp4aq1e-split-main-memory-stability-freeze.md
      - run: bun run typecheck
      - name: Commit AQ1E
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bench(competitive): split CP4-AQ1E main and memory calibration"
          git push
