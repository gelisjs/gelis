name: CP4-AW Memory Harness

on:
  push:
    branches:
      - work/competitive-cp4aw-collision-memory-gate

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Generate harness
        run: |
          git fetch --no-tags origin cdad3f3d6013abc435fed4411dda4dcf90e74c67
          python scripts/cp4aw-memory-harness.py
          bunx prettier --write bench/runtime/cp4aw-collision-memory-gate.mts
      - name: Validate harness
        run: bun run check
      - name: Commit harness and clean generator
        run: |
          rm .github/workflows/cp4aw-memory-harness.yml
          rm scripts/cp4aw-memory-harness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bench(runtime): add CP4-AW collision memory gate"
          git push origin HEAD:work/competitive-cp4aw-collision-memory-gate
