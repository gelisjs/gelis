name: CP4-AQ0 correctness probe

on:
  push:
    branches:
      - work/competitive-cp4aq0-benchmark-stability-calibration

permissions:
  contents: read

jobs:
  probe:
    name: CP4-AQ0 correctness only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CP4-AQ0 correctness probe
        run: bun bench/runtime/cp4aq0-benchmark-stability-calibration.mts --probe-only
