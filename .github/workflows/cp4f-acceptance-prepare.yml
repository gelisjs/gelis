name: CP4-F Acceptance Prepare

on:
  push:
    branches:
      - work/competitive-cp4f-method-table-kind
    paths:
      - .cp4f-acceptance-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4f-method-table-kind
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Generate CP4-F acceptance artifacts
        run: python .github/scripts/cp4f_acceptance_prepare.py

      - name: Format frozen artifacts
        run: bunx prettier --write bench/runtime/cp4f-method-table-kind-acceptance.mts bench/runtime/cp4f-method-table-kind-worker.mts docs/benchmarks/competitive-cp4f-method-table-kind-freeze.md

      - name: Full quality
        run: bun run check

      - name: Commit frozen acceptance artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4f-method-table-kind-acceptance.mts bench/runtime/cp4f-method-table-kind-worker.mts docs/benchmarks/competitive-cp4f-method-table-kind-freeze.md
          git diff --cached --quiet && exit 0
          git commit -m "bench(competitive): freeze CP4-F method-table kind acceptance"
          git push origin HEAD:work/competitive-cp4f-method-table-kind
