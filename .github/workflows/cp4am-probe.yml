name: CP4-AM Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4am-ak-inline-all-fallback-viability
    paths:
      - .cp4am-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4am-ak-inline-all-fallback-viability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run CP4-AM correctness probe only
        run: bun bench/runtime/cp4am-ak-inline-all-fallback-viability.mts --probe-only
