name: CP4-B Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4b-production-url-offset

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4B_SOURCE_PREPARE'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4b-production-url-offset
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-B production-shaped URL-offset candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          router_path = Path('src/runtime/router.ts')
          router = router_path.read_text()

          old = 'import type { RuntimeRouteRecord } from "./types";\n'
          new = 'import { pathnameFromRequestUrl } from "./url";\n\nimport type { RuntimeRouteRecord } from "./types";\n'
          if old not in router:
              raise SystemExit('router import anchor missing')
          router = router.replace(old, new, 1)

          anchor = '''  matchingMethods(pathname: string): string[] {\n'''
          method = '''  matchRequestUrl(method: string, url: string): RuntimeRouteMatch | undefined {\n    const table = this.#methods.get(method);\n\n    if (!table) {\n      return undefined;\n    }\n\n    let authorityStart: number;\n\n    if (\n      url.charCodeAt(0) !== 104 ||\n      url.charCodeAt(1) !== 116 ||\n      url.charCodeAt(2) !== 116 ||\n      url.charCodeAt(3) !== 112\n    ) {\n      return this.match(method, pathnameFromRequestUrl(url));\n    }\n\n    if (\n      url.charCodeAt(4) === 58 &&\n      url.charCodeAt(5) === 47 &&\n      url.charCodeAt(6) === 47\n    ) {\n      authorityStart = 7;\n    } else if (\n      url.charCodeAt(4) === 115 &&\n      url.charCodeAt(5) === 58 &&\n      url.charCodeAt(6) === 47 &&\n      url.charCodeAt(7) === 47\n    ) {\n      authorityStart = 8;\n    } else {\n      return this.match(method, pathnameFromRequestUrl(url));\n    }\n\n    const pathStart = url.indexOf("/", authorityStart);\n\n    if (pathStart === -1) {\n      return this.match(method, "/");\n    }\n\n    const queryStart = url.indexOf("?", pathStart + 1);\n    const pathEnd = queryStart === -1 ? url.length : queryStart;\n\n    let pathname: string | undefined;\n\n    /*\n     * Preserve exact static precedence before every dynamic path.\n     * Pure-dynamic method tables skip pathname slicing entirely.\n     */\n    if (table.staticRoutes.size !== 0) {\n      pathname = url.slice(pathStart, pathEnd);\n\n      const staticRoute = table.staticRoutes.get(pathname);\n\n      if (staticRoute) {\n        return {\n          route: staticRoute,\n          params: EMPTY_PARAMS,\n        };\n      }\n    }\n\n    if (!table.usesDynamicTrie) {\n      const trailingParamFingerprints = table.trailingParamFingerprints;\n      const trailingParamRoutes = table.trailingParamRoutes;\n\n      if (\n        pathEnd - pathStart > 1 &&\n        (trailingParamFingerprints !== undefined ||\n          trailingParamRoutes !== undefined)\n      ) {\n        const slash = url.lastIndexOf("/", pathEnd - 1);\n\n        if (slash >= pathStart) {\n          const prefixEnd = slash + 1;\n          const prefixLength = prefixEnd - pathStart;\n\n          let trailingRoute: TrailingParamRoute | undefined;\n\n          if (trailingParamFingerprints !== undefined) {\n            const entry = trailingParamFingerprints.get(\n              prefixFingerprintRange(url, prefixEnd, prefixLength),\n            );\n\n            if (entry?.kind === "unique") {\n              if (\n                entry.prefix.length === prefixLength &&\n                url.startsWith(entry.prefix, pathStart)\n              ) {\n                trailingRoute = entry.trailingRoute;\n              }\n            } else if (entry !== undefined) {\n              trailingRoute = entry.routes.get(url.slice(pathStart, prefixEnd));\n            }\n          } else if (trailingParamRoutes !== undefined) {\n            trailingRoute = trailingParamRoutes.get(\n              url.slice(pathStart, prefixEnd),\n            );\n          }\n\n          if (trailingRoute) {\n            const value = url.slice(prefixEnd, pathEnd);\n\n            return {\n              route: trailingRoute.route,\n              params: {\n                [trailingRoute.paramName]: decodeParam(value),\n              },\n            };\n          }\n        }\n      }\n\n      return undefined;\n    }\n\n    pathname ??= url.slice(pathStart, pathEnd);\n\n    const captures: number[] = [];\n    const dynamicRoute = matchDynamicPath(\n      table.dynamicRoot,\n      pathname,\n      captures,\n    );\n\n    if (!dynamicRoute) {\n      return undefined;\n    }\n\n    const params: Record<string, string> = {};\n\n    for (let index = 0; index < dynamicRoute.paramNames.length; index++) {\n      const name = dynamicRoute.paramNames[index];\n      const start = captures[index * 2];\n      const end = captures[index * 2 + 1];\n\n      if (name === undefined || start === undefined || end === undefined) {\n        continue;\n      }\n\n      params[name] = decodeParam(pathname.slice(start, end));\n    }\n\n    return {\n      route: dynamicRoute.route,\n      params,\n    };\n  }\n\n'''
          if anchor not in router:
              raise SystemExit('router method anchor missing')
          router = router.replace(anchor, method + anchor, 1)

          helper_anchor = '''function codeBefore(value: string, end: number, distance: number): number {\n'''
          helper = '''function prefixFingerprintRange(\n  value: string,\n  absoluteEnd: number,\n  prefixLength: number,\n): number {\n  let hash = Math.imul(prefixLength, -1640531527);\n\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 2), -2048144789);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 3), -1028477387);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 4), 668265263);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 5), 374761393);\n\n  return hash | 0;\n}\n\n'''
          if helper_anchor not in router:
              raise SystemExit('router fingerprint helper anchor missing')
          router = router.replace(helper_anchor, helper + helper_anchor, 1)
          router_path.write_text(router)

          app_path = Path('src/app.ts')
          app = app_path.read_text()

          old_interface = '''  match(\n    method: string,\n\n    pathname: string,\n  ): RuntimeRouteMatch | undefined;\n\n  matchingMethods(pathname: string): string[];\n'''
          new_interface = '''  match(\n    method: string,\n\n    pathname: string,\n  ): RuntimeRouteMatch | undefined;\n\n  matchRequestUrl?(\n    method: string,\n\n    url: string,\n  ): RuntimeRouteMatch | undefined;\n\n  matchingMethods(pathname: string): string[];\n'''
          if old_interface not in app:
              raise SystemExit('app interface anchor missing')
          app = app.replace(old_interface, new_interface, 1)

          old_fetch = '''    const pathname = pathnameFromRequestUrl(request.url);\n\n    let matched = this.#state.router.match(method, pathname);\n\n    if (matched === undefined) {\n      const fallback = resolveMethodMiss(this.#state.router, method, pathname);\n'''
          new_fetch = '''    const router = this.#state.router;\n    const matchRequestUrl = router.matchRequestUrl;\n\n    let pathname: string | undefined;\n    let matched: RuntimeRouteMatch | undefined;\n\n    if (matchRequestUrl === undefined) {\n      pathname = pathnameFromRequestUrl(request.url);\n      matched = router.match(method, pathname);\n    } else {\n      matched = matchRequestUrl.call(router, method, request.url);\n    }\n\n    if (matched === undefined) {\n      pathname ??= pathnameFromRequestUrl(request.url);\n\n      const fallback = resolveMethodMiss(router, method, pathname);\n'''
          if old_fetch not in app:
              raise SystemExit('app fetch anchor missing')
          app = app.replace(old_fetch, new_fetch, 1)
          app_path.write_text(app)

          Path('test/runtime/url-offset-routing.test.ts').write_text('''import { describe, expect, test } from "bun:test";\n\nimport { Gelis } from "../../src";\nimport { GELIS_INTERNAL_RUNTIME } from "../../src/app";\nimport { Router } from "../../src/runtime/router";\n\ndescribe("request URL offset routing", () => {\n  test("preserves static precedence over trailing dynamic routes", async () => {\n    const app = new Gelis();\n\n    app.get("/users/:id", ({ params }) => `dynamic:${params.id}`);\n    app.get("/users/me", () => "static");\n\n    const response = await app.fetch(\n      new Request("http://gelis.test/users/me?source=test"),\n    );\n\n    expect(await response.text()).toBe("static");\n  });\n\n  test("bounds trailing params before query strings", async () => {\n    const app = new Gelis();\n\n    app.get("/users/:id", ({ params }) => params.id);\n\n    const response = await app.fetch(\n      new Request("http://gelis.test/users/value-42?source=test"),\n    );\n\n    expect(await response.text()).toBe("value-42");\n  });\n\n  test("decodes encoded trailing params", async () => {\n    const app = new Gelis();\n\n    app.get("/users/:id", ({ params }) => params.id);\n\n    const response = await app.fetch(\n      new Request("https://gelis.test/users/value%2042?source=test"),\n    );\n\n    expect(await response.text()).toBe("value 42");\n  });\n\n  test("preserves generic multi-param fallback", async () => {\n    const app = new Gelis();\n\n    app.get("/teams/:team/users/:id", ({ params }) => ({\n      team: params.team,\n      id: params.id,\n    }));\n\n    const response = await app.fetch(\n      new Request("http://gelis.test/teams/core/users/42?source=test"),\n    );\n\n    expect(await response.json()).toEqual({ team: "core", id: "42" });\n  });\n\n  test("preserves root static routing", async () => {\n    const app = new Gelis();\n\n    app.get("/", () => "root");\n\n    const response = await app.fetch(new Request("http://gelis.test/"));\n\n    expect(await response.text()).toBe("root");\n  });\n\n  test("falls back for routers without matchRequestUrl", async () => {\n    const app = new Gelis();\n    const router = new Router();\n\n    const legacyRouter = {\n      register: router.register.bind(router),\n      registerBatchAtomic: router.registerBatchAtomic.bind(router),\n      match: router.match.bind(router),\n      matchingMethods: router.matchingMethods.bind(router),\n    };\n\n    app[GELIS_INTERNAL_RUNTIME]().installRouter(legacyRouter);\n    app.get("/legacy/:id", ({ params }) => params.id);\n\n    const response = await app.fetch(\n      new Request("http://gelis.test/legacy/value-42?source=test"),\n    );\n\n    expect(await response.text()).toBe("value-42");\n  });\n});\n''')
          PY
      - name: Format candidate source and tests
        run: bunx prettier --write src/runtime/router.ts src/app.ts test/runtime/url-offset-routing.test.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen source candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts src/app.ts test/runtime/url-offset-routing.test.ts
          git commit -m "perf(runtime): add production request URL offset routing"
          git push origin HEAD:work/competitive-cp4b-production-url-offset
