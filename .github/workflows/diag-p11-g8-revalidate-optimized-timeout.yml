name: P11-G8 Optimized Timeout Revalidation

on:
  push:
    branches:
      - work/p11-g8-revalidate-optimized-timeout

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Prepare frozen control and candidate worktrees
        shell: bash
        run: |
          git worktree add --detach ../p11-g8-control c6a65d639679464744ba3be21cfc8acb0f850d9a
          git worktree add --detach ../p11-g8-candidate 1dd5f94cf0e9ad884ca44e537ee287587cd8baab
          test -z "$(git -C ../p11-g8-control status --porcelain)"
          test -z "$(git -C ../p11-g8-candidate status --porcelain)"
          test "$(git -C ../p11-g8-control rev-parse HEAD)" = "c6a65d639679464744ba3be21cfc8acb0f850d9a"
          test "$(git -C ../p11-g8-candidate rev-parse HEAD)" = "1dd5f94cf0e9ad884ca44e537ee287587cd8baab"
      - name: Run frozen P11-G8 zero-unused gate
        run: |
          bun bench/request-id-timeout/p11-g8-zero-unused-acceptance.mts \
            --control-root=../p11-g8-control \
            --candidate-root=../p11-g8-candidate
