name: CP4-AK Source Prepare

on:
  push:
    branches:
      - work/cp4ak-static-leading-mask-source
    paths:
      - .cp4ak-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/cp4ak-static-leading-mask-source
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply static-leading mask candidate
        run: python .github/scripts/cp4ak_static_leading_mask.py
      - name: Format candidate source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(router): discriminate mixed static lookup by leading mask"
          git push origin HEAD:work/cp4ak-static-leading-mask-source
