name: CP4-D Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4d-static-length-range

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4D_SOURCE_PREPARE_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4d-static-length-range
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-D source candidate
        run: python3 .github/scripts/cp4d_source_candidate.py
      - name: Format source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen CP4-D source candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts
          git commit -m "perf(runtime): use static path-length range discriminator"
          git push origin HEAD:work/competitive-cp4d-static-length-range
