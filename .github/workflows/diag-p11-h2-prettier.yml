name: P11-H2 Cumulative Test Prettier

on:
  push:
    branches:
      - diag/p11-h2-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Checkout target branch
        run: git switch work/p11-h2-cumulative-correctness
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier
        run: bunx prettier test/runtime/p11-h-cumulative-composition.test.ts --write
      - name: Commit formatted test
        shell: bash
        run: |
          git diff --check
          git config user.name "Rigent"
          git config user.email "127601320+rigenttio@users.noreply.github.com"
          git add test/runtime/p11-h-cumulative-composition.test.ts
          git commit -m "style(p11-h): format cumulative composition test"
          git push origin HEAD:work/p11-h2-cumulative-correctness
