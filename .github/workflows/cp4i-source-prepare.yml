name: CP4-I Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4i-mixed-upper-bound
    paths:
      - .cp4i-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4i-mixed-upper-bound
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-I source transform
        run: python .github/scripts/cp4i_mixed_upper_bound.py
      - name: Format changed source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(runtime): use mixed static upper-bound discriminator"
          git push origin HEAD:work/competitive-cp4i-mixed-upper-bound
