name: CP4-T Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4t-all-table-miss-fallback
    paths:
      - .cp4t-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4t-all-table-miss-fallback
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Restore exact CP4-Q production source
        run: |
          git show b268a99f58e6c055ed0255c30ea16783f85fb5f3:src/runtime/router.ts > src/runtime/router.ts
          git show b268a99f58e6c055ed0255c30ea16783f85fb5f3:src/runtime/router-all.ts > src/runtime/router-all.ts
      - name: Apply direct ALL table-miss fallback
        run: python .github/scripts/cp4t_all_table_miss_fallback.py
      - name: Format changed source and CP4-S evidence
        run: bunx prettier --write src/runtime/router.ts src/runtime/router-all.ts docs/benchmarks/competitive-cp4s-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts src/runtime/router-all.ts docs/benchmarks/competitive-cp4s-local-authoritative.md
          git commit -m "perf(runtime): fallback ALL on request URL table miss"
          git push origin HEAD:work/competitive-cp4t-all-table-miss-fallback
