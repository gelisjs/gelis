name: P11-G2 Request ID Core Candidate

on:
  push:
    branches:
      - work/p11-g2-request-id-core
    paths:
      - .github/workflows/p11-g2-request-id-core-candidate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format G2 files
        run: |
          bunx prettier --write src/request-id/policy.ts src/request-id/state.ts test/runtime/request-id-policy.test.ts

      - name: Targeted request ID tests
        run: bun test test/runtime/request-id-policy.test.ts

      - name: Full quality gate
        run: bun run check

      - name: Commit candidate and remove temporary workflow
        run: |
          git rm .github/workflows/p11-g2-request-id-core-candidate.yml
          git add src/request-id/policy.ts src/request-id/state.ts test/runtime/request-id-policy.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(request-id): complete G2 request ID core"
          git push origin HEAD:work/p11-g2-request-id-core
