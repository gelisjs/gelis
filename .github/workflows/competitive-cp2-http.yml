name: Competitive CP2-H Correctness Harness

on:
  push:
    branches:
      - work/competitive-cp2-core-crown

permissions:
  contents: read

jobs:
  http-harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frozen competitive dependencies
        run: bun install --cwd bench/competitive --frozen-lockfile

      - name: Install frozen Elysia AOT island
        run: bun install --cwd bench/competitive/elysia-v2-aot --frozen-lockfile

      - name: Typecheck competitive harness
        working-directory: bench/competitive
        run: bun ../../node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Typecheck Elysia AOT harness
        working-directory: bench/competitive/elysia-v2-aot
        run: bun ../../../node_modules/typescript/bin/tsc -p tsconfig.json --noEmit

      - name: Run CP2-H correctness probe only
        working-directory: bench/competitive
        run: bun core/http-acceptance.mts --probe-only
