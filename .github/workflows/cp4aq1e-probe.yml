name: CP4-AQ1E probe

on:
  push:
    branches:
      - work/competitive-cp4aq1e-split-main-memory-stability

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun bench/runtime/cp4aq1e-main-stability-calibration.mts --probe-only
      - run: bun bench/runtime/cp4aq1e-memory-stability-calibration.mts --probe-only
