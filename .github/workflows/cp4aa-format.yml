name: CP4-AA Format

on:
  push:
    branches:
      - work/competitive-cp4aa-production-x-z-attribution
    paths:
      - .cp4aa-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4aa-production-x-z-attribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aa-production-x-z-attribution.mts docs/benchmarks/competitive-cp4z-local-authoritative.md docs/benchmarks/competitive-cp4aa-production-x-z-attribution-freeze.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4aa-production-x-z-attribution.mts docs/benchmarks/competitive-cp4z-local-authoritative.md docs/benchmarks/competitive-cp4aa-production-x-z-attribution-freeze.md
          git commit -m "style(bench): format CP4-AA artifacts"
          git push origin HEAD:work/competitive-cp4aa-production-x-z-attribution
