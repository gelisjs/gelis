name: CP3-T Prepare Decomposition

on:
  push:
    branches:
      - work/competitive-cp3t-pipeline-translation-decomposition

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP3T_PREPARE'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CP3-T files
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            bench/runtime/cp3t-pipeline-translation-acceptance.mts \
            bench/runtime/cp3t-pipeline-translation-worker.mts \
            docs/benchmarks/competitive-cp3t-pipeline-translation-freeze.md \
            --write

      - name: Commit formatted harness locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bench/runtime/cp3t-pipeline-translation-acceptance.mts \
            bench/runtime/cp3t-pipeline-translation-worker.mts \
            docs/benchmarks/competitive-cp3t-pipeline-translation-freeze.md
          if git diff --cached --quiet; then
            git commit --allow-empty -m "bench(competitive): freeze CP3-T decomposition harness"
          else
            git commit -m "bench(competitive): freeze CP3-T decomposition harness"
          fi

      - name: Run full repository quality gate
        run: bun run check

      - name: Run CP3-T correctness probe
        run: bun bench/runtime/cp3t-pipeline-translation-acceptance.mts --probe-only

      - name: Verify temporary worktree cleanup
        shell: bash
        run: |
          if git worktree list --porcelain | grep -F "gelis-cp3t-baseline-"; then
            echo "CP3-T temporary baseline worktree remained after probe" >&2
            exit 1
          fi

      - name: Push accepted harness
        run: git push
