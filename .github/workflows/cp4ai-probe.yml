name: CP4-AI Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4ai-lazy-capability-production-acceptance
    paths:
      - .cp4ai-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ai-lazy-capability-production-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run CP4-AI correctness probe only
        run: bun bench/runtime/cp4ai-lazy-capability-production-acceptance.mts --probe-only
