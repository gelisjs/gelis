name: CP3-S Prepare Harness

on:
  push:
    branches:
      - work/competitive-cp3s-single-index-fingerprint

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP3S_PREPARE'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate CP3-S harness from frozen CP3-R harness
        run: python3 .cp3s-prepare.py

      - name: Format CP3-S files
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            bench/runtime/cp3s-single-index-fingerprint-acceptance.mts \
            bench/runtime/cp3s-single-index-fingerprint-worker.mts \
            docs/benchmarks/competitive-cp3s-single-index-fingerprint-freeze.md \
            --write

      - name: Commit generated harness locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bench/runtime/cp3s-single-index-fingerprint-acceptance.mts \
            bench/runtime/cp3s-single-index-fingerprint-worker.mts \
            docs/benchmarks/competitive-cp3s-single-index-fingerprint-freeze.md
          git commit -m "bench(competitive): add CP3-S single-index acceptance harness"

      - name: Run full repository quality gate
        run: bun run check

      - name: Run CP3-S correctness probe
        run: bun bench/runtime/cp3s-single-index-fingerprint-acceptance.mts --probe-only

      - name: Verify temporary worktree cleanup
        shell: bash
        run: |
          if git worktree list --porcelain | grep -F "gelis-cp3s-baseline-"; then
            echo "CP3-S temporary baseline worktree remained after probe" >&2
            exit 1
          fi

      - name: Push accepted harness
        run: git push
