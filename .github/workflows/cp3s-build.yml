name: CP3-S Build Candidate

on:
  push:
    branches:
      - work/competitive-cp3s-single-index-fingerprint

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'ci(competitive): build CP3-S single-index candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply CP3-S single-index transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/runtime/router.ts")
          text = path.read_text()

          # Fast-map match: allow either the fingerprint index or legacy canonical map.
          comment = text.index("     * Fast-map mode.")
          start = text.index("    if (!table.usesDynamicTrie) {", comment)
          end = text.index("\n\n    /*\n     * Generic mode.", start)
          replacement = '''    if (!table.usesDynamicTrie) {
            const trailingParamFingerprints = table.trailingParamFingerprints;

            const trailingParamRoutes = table.trailingParamRoutes;

            if (
              pathname !== "/" &&
              (trailingParamFingerprints !== undefined ||
                trailingParamRoutes !== undefined)
            ) {
              const slash = pathname.lastIndexOf("/");

              if (slash >= 0) {
                const prefixEnd = slash + 1;

                let trailingRoute: TrailingParamRoute | undefined;

                if (trailingParamFingerprints !== undefined) {
                  const entry = trailingParamFingerprints.get(
                    prefixFingerprint(pathname, prefixEnd),
                  );

                  if (entry?.kind === "unique") {
                    if (
                      entry.prefix.length === prefixEnd &&
                      pathname.startsWith(entry.prefix)
                    ) {
                      trailingRoute = entry.trailingRoute;
                    }
                  } else if (entry !== undefined) {
                    trailingRoute = entry.routes.get(pathname.slice(0, prefixEnd));
                  }
                } else if (trailingParamRoutes !== undefined) {
                  trailingRoute = trailingParamRoutes.get(
                    pathname.slice(0, prefixEnd),
                  );
                }

                if (trailingRoute) {
                  const value = pathname.slice(prefixEnd);

                  return {
                    route: trailingRoute.route,

                    params: {
                      [trailingRoute.paramName]: decodeParam(value),
                    },
                  };
                }
              }
            }

            return undefined;
          }'''
          text = text[:start] + replacement + text[end:]

          # matchingMethods gets the same dual-format compatibility behavior.
          method_start = text.index("function methodTableMatchesPath(")
          start = text.index("  if (!table.usesDynamicTrie) {", method_start)
          end = text.index("\n\n  return dynamicTableMatchesPath(", start)
          replacement = '''  if (!table.usesDynamicTrie) {
            const trailingParamFingerprints = table.trailingParamFingerprints;

            const trailingParamRoutes = table.trailingParamRoutes;

            if (
              pathname !== "/" &&
              (trailingParamFingerprints !== undefined ||
                trailingParamRoutes !== undefined)
            ) {
              const slash = pathname.lastIndexOf("/");

              if (slash >= 0) {
                const prefixEnd = slash + 1;

                if (trailingParamFingerprints !== undefined) {
                  const entry = trailingParamFingerprints.get(
                    prefixFingerprint(pathname, prefixEnd),
                  );

                  if (entry?.kind === "unique") {
                    return (
                      entry.prefix.length === prefixEnd &&
                      pathname.startsWith(entry.prefix)
                    );
                  }

                  if (
                    entry !== undefined &&
                    entry.routes.has(pathname.slice(0, prefixEnd))
                  ) {
                    return true;
                  }
                } else if (
                  trailingParamRoutes !== undefined &&
                  trailingParamRoutes.has(pathname.slice(0, prefixEnd))
                ) {
                  return true;
                }
              }
            }

            return false;
          }'''
          text = text[:start] + replacement + text[end:]

          # Runtime registration owns exactly one trailing index. New/normal tables choose
          # fingerprint; legacy/AOT tables that already own a string map stay on that map.
          start = text.index(
              "  if (trailingParamName !== undefined && !table.usesDynamicTrie) {"
          )
          end = text.index("\n\n  if (!table.usesDynamicTrie) {", start)
          replacement = '''  if (trailingParamName !== undefined && !table.usesDynamicTrie) {
            const slash = route.path.lastIndexOf("/");

            if (slash >= 0) {
              const prefix = route.path.slice(0, slash + 1);

              const trailingRoute = {
                route,

                paramName: trailingParamName,
              };

              if (table.trailingParamFingerprints !== undefined) {
                if (!registerTrailingFingerprint(table, prefix, trailingRoute)) {
                  throw duplicateRoute(route);
                }

                return;
              }

              const trailingParamRoutes = table.trailingParamRoutes;

              if (trailingParamRoutes !== undefined) {
                if (trailingParamRoutes.has(prefix)) {
                  throw duplicateRoute(route);
                }

                trailingParamRoutes.set(prefix, trailingRoute);

                return;
              }

              if (!registerTrailingFingerprint(table, prefix, trailingRoute)) {
                throw duplicateRoute(route);
              }

              return;
            }
          }'''
          text = text[:start] + replacement + text[end:]

          # Migration consumes whichever one index exists and releases it afterward.
          start = text.index("function migrateTrailingRoutesToTrie(")
          end = text.index("\n\nfunction registerTrailingFingerprint(", start)
          replacement = '''function migrateTrailingRoutesToTrie(table: MethodRoutes): void {
            const trailingParamFingerprints = table.trailingParamFingerprints;

            if (trailingParamFingerprints !== undefined) {
              for (const entry of trailingParamFingerprints.values()) {
                if (entry.kind === "unique") {
                  registerDynamicRoute(table.dynamicRoot, entry.trailingRoute.route);

                  continue;
                }

                for (const trailingRoute of entry.routes.values()) {
                  registerDynamicRoute(table.dynamicRoot, trailingRoute.route);
                }
              }

              delete table.trailingParamFingerprints;

              table.trailingParamRoutes = undefined;

              return;
            }

            const trailingParamRoutes = table.trailingParamRoutes;

            if (!trailingParamRoutes) {
              return;
            }

            for (const trailingRoute of trailingParamRoutes.values()) {
              registerDynamicRoute(
                table.dynamicRoot,

                trailingRoute.route,
              );
            }

            /*
             * Generic mode never consults this structure.
             * Release it after migration.
             */
            table.trailingParamRoutes = undefined;
          }'''
          text = text[:start] + replacement + text[end:]

          # Fingerprint registration becomes the canonical duplicate detector in single-index mode.
          start = text.index("function registerTrailingFingerprint(")
          end = text.index("\n\nfunction cloneTrailingParamFingerprints(", start)
          replacement = '''function registerTrailingFingerprint(
            table: MethodRoutes,

            prefix: string,

            trailingRoute: TrailingParamRoute,
          ): boolean {
            let fingerprints = table.trailingParamFingerprints;

            if (fingerprints === undefined) {
              fingerprints = new Map();

              table.trailingParamFingerprints = fingerprints;
            }

            const key = prefixFingerprint(prefix, prefix.length);

            const existing = fingerprints.get(key);

            if (existing === undefined) {
              fingerprints.set(key, {
                kind: "unique",

                prefix,

                trailingRoute,
              });

              return true;
            }

            if (existing.kind === "unique") {
              if (existing.prefix === prefix) {
                return false;
              }

              fingerprints.set(key, {
                kind: "collision",

                routes: new Map([
                  [existing.prefix, existing.trailingRoute],
                  [prefix, trailingRoute],
                ]),
              });

              return true;
            }

            if (existing.routes.has(prefix)) {
              return false;
            }

            existing.routes.set(prefix, trailingRoute);

            return true;
          }'''
          text = text[:start] + replacement + text[end:]

          if "registerTrailingFingerprint(table, prefix, trailingRoute);" in text:
              raise SystemExit("unchecked fingerprint registration call remains")
          if text.count("trailingParamFingerprints") < 12:
              raise SystemExit("single-index sidecar references missing")

          path.write_text(text)
          PY

      - name: Format candidate and freeze
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            src/runtime/router.ts \
            docs/benchmarks/competitive-cp3s-single-index-fingerprint-freeze.md \
            --write

      - name: Run full repository quality gate
        run: bun run check

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts docs/benchmarks/competitive-cp3s-single-index-fingerprint-freeze.md
          git commit -m "perf(router): stage CP3-S single-index fingerprint candidate"
          git push
