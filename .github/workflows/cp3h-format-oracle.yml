name: CP3-H Format Oracle

on:
  push:
    branches:
      - work/competitive-cp3h-fresh-path-boundary

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format target files and print diff
        shell: bash
        run: |
          bunx prettier \
            bench/runtime/cp3h-fresh-path-boundary-worker.mts \
            docs/benchmarks/competitive-cp3g-local-authoritative.md \
            docs/benchmarks/competitive-cp3h-fresh-path-boundary-freeze.md \
            --write
          git diff -- \
            bench/runtime/cp3h-fresh-path-boundary-worker.mts \
            docs/benchmarks/competitive-cp3g-local-authoritative.md \
            docs/benchmarks/competitive-cp3h-fresh-path-boundary-freeze.md
