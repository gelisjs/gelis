name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run check

      - name: Setup Bun 1.4.2 for CP4-AD probe
        if: github.ref == 'refs/heads/work/competitive-cp4ad-component-attribution'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Fetch CP4-AD exact source commits
        if: github.ref == 'refs/heads/work/competitive-cp4ad-component-attribution'
        run: |
          git fetch --no-tags --depth=2 origin work/cp4ad-min-only-source
          git fetch --no-tags --depth=2 origin work/cp4ad-kind-src

      - name: Run CP4-AD correctness probe only
        if: github.ref == 'refs/heads/work/competitive-cp4ad-component-attribution'
        run: bun bench/runtime/cp4ad-dead-metadata-component-attribution.mts --probe-only
