name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run check

      - name: Setup Bun 1.4.2 for CP4-AG probe
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Fetch CP4-AG source ancestry
        run: git fetch --no-tags --unshallow origin

      - name: Run CP4-AG correctness probe only
        run: bun bench/runtime/cp4ag-z-kind-blockwise-stability.mts --probe-only
