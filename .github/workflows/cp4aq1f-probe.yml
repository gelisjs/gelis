name: CP4-AQ1F probe

on:
  push:
    branches:
      - work/competitive-cp4aq1f-epoch-abba-variance-decomposition

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun bench/runtime/cp4aq1f-epoch-abba-variance-decomposition.mts --probe-only
