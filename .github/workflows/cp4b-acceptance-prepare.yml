name: CP4-B Acceptance Prepare

on:
  push:
    branches:
      - work/competitive-cp4b-production-url-offset

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4B_ACCEPTANCE_PREPARE'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4b-production-url-offset
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format CP4-B acceptance files
        run: |
          bunx prettier --write \
            bench/runtime/cp4b-production-url-offset-worker.mts \
            bench/runtime/cp4b-production-url-offset-acceptance.mts \
            docs/benchmarks/competitive-cp4b-production-url-offset-freeze.md
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add bench/runtime/cp4b-production-url-offset-worker.mts \
              bench/runtime/cp4b-production-url-offset-acceptance.mts \
              docs/benchmarks/competitive-cp4b-production-url-offset-freeze.md
            git commit -m "chore(competitive): format CP4-B acceptance harness"
            git push origin HEAD:work/competitive-cp4b-production-url-offset
          fi
      - name: Full quality
        run: bun run check
      - name: CP4-B correctness probe
        run: bun bench/runtime/cp4b-production-url-offset-acceptance.mts --probe-only
      - name: Verify frozen source guard
        run: git diff --quiet ca7543b46ad68b89a9d2b10d29e052993b216758 HEAD -- src
      - name: Verify no CP4-B baseline worktree remains
        run: |
          if git worktree list --porcelain | grep -q 'gelis-cp4b-baseline'; then
            echo 'CP4-B baseline worktree remained after probe'
            exit 1
          fi
