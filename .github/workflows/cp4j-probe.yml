name: CP4-J Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4j-full-production-acceptance
    paths:
      - .cp4j-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4j-full-production-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-J correctness probe only
        run: bun bench/runtime/cp4j-full-production-acceptance.mts --probe-only
