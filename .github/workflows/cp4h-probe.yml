name: CP4-H Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4h-fast-map-primary-discriminator
    paths:
      - .cp4h-probe-trigger

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4h-fast-map-primary-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-H correctness probe only
        run: bun bench/runtime/cp4h-fast-map-primary-acceptance.mts --probe-only
