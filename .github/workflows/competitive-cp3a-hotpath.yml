name: Competitive CP3-A Hot-Path Decomposition Harness

on:
  push:
    branches:
      - work/competitive-cp3a-hotpath-decomposition

jobs:
  decomposition-harness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck benchmark harness
        run: bun run typecheck:bench

      - name: Run CP3-A correctness probe only
        run: bun bench/competitive/decompose/hotpath-acceptance.mts --probe-only
