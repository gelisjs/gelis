name: CP3-V Source Prepare

on:
  push:
    branches:
      - work/competitive-cp3v-fingerprint-string-success

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP3V_SOURCE_PREPARE'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CP3-V candidate files
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            src/runtime/response.ts \
            test/runtime/response-success.test.ts \
            docs/benchmarks/competitive-cp3v-fingerprint-string-success-freeze.md \
            --write

      - name: Commit formatted candidate locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/runtime/response.ts \
            test/runtime/response-success.test.ts \
            docs/benchmarks/competitive-cp3v-fingerprint-string-success-freeze.md
          if git diff --cached --quiet; then
            git commit --allow-empty -m "perf(runtime): freeze CP3-V source candidate"
          else
            git commit -m "perf(runtime): freeze CP3-V source candidate"
          fi

      - name: Run full repository quality gate
        run: bun run check

      - name: Push frozen candidate
        run: git push
