name: CP4-AQ3 probe

on:
  push:
    branches:
      - work/competitive-cp4aq3-production-performance-decision-protocol
    paths:
      - .github/workflows/cp4aq3-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun bench/runtime/cp4aq3-production-performance-decision.mts --probe-only --candidate=5d9698d6b8d368ddcff358fc2645435b93c0c062