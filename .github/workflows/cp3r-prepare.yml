name: CP3-R Prepare Harness

on:
  push:
    branches:
      - work/competitive-cp3r-production-shape-fingerprint

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'ci(competitive): prepare CP3-R acceptance harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CP3-R files
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            bench/runtime/cp3r-production-shape-fingerprint-acceptance.mts \
            bench/runtime/cp3r-production-shape-fingerprint-worker.mts \
            docs/benchmarks/competitive-cp3r-production-shape-fingerprint-freeze.md \
            --write

      - name: Commit formatted harness
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Harness already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+rigenttio@users.noreply.github.com"
            git add \
              bench/runtime/cp3r-production-shape-fingerprint-acceptance.mts \
              bench/runtime/cp3r-production-shape-fingerprint-worker.mts \
              docs/benchmarks/competitive-cp3r-production-shape-fingerprint-freeze.md
            git commit -m "chore(competitive): format CP3-R harness"
          fi

      - name: Run full repository quality gate
        run: bun run check

      - name: Run CP3-R correctness probe
        run: bun bench/runtime/cp3r-production-shape-fingerprint-acceptance.mts --probe-only

      - name: Verify no temporary worktree remains
        shell: bash
        run: |
          if git worktree list --porcelain | grep -F "gelis-cp3r-baseline-"; then
            echo "CP3-R temporary baseline worktree remained after probe" >&2
            exit 1
          fi

      - name: Push formatted harness
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "chore(competitive): format CP3-R harness"; then
            git push
          else
            echo "Nothing to push"
          fi
