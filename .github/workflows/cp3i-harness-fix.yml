name: CP3-I Harness Fix

on:
  push:
    branches:
      - work/competitive-cp3i-request-lookup-strategies

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply CP3-I type-only harness fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bench/runtime/cp3i-request-lookup-worker.mts')
          text = path.read_text()

          replacements = {
              'return routerCell(trailingRouter, false, false);': 'return routerCell(trailingRouter, false);',
              'return routerCell(genericRouter, false, true);': 'return routerCell(genericRouter, false);',
              'return routerCell(trailingRouter, true, false);': 'return routerCell(trailingRouter, true);',
              'return routerCell(genericRouter, true, true);': 'return routerCell(genericRouter, true);',
              'return dispatchCell(trailingRouter, false, false);': 'return dispatchCell(trailingRouter, false);',
              'return dispatchCell(genericRouter, false, true);': 'return dispatchCell(genericRouter, false);',
              'return dispatchCell(trailingRouter, true, false);': 'return dispatchCell(trailingRouter, true);',
              'return dispatchCell(genericRouter, true, true);': 'return dispatchCell(genericRouter, true);',
              'function routerCell(\n  router: Router,\n  fromRequest: boolean,\n  generic: boolean,\n): PreparedCell {': 'function routerCell(router: Router, fromRequest: boolean): PreparedCell {',
              '      assertTargetMatch(router, path, generic);': '      assertTargetMatch(router, path);',
              'function dispatchCell(\n  router: Router,\n  fromRequest: boolean,\n  generic: boolean,\n): PreparedCell {': 'function dispatchCell(router: Router, fromRequest: boolean): PreparedCell {',
              'function assertTargetMatch(\n  router: Router,\n  path: string,\n  generic: boolean,\n): void {': 'function assertTargetMatch(router: Router, path: string): void {',
              '\n  if (generic && match.route.path === "/force/:a/:b") {\n    throw new Error("generic dummy route unexpectedly matched target");\n  }': '',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected text not found: {old!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

          bunx prettier bench/runtime/cp3i-request-lookup-worker.mts --write
          bun run typecheck:bench

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp3i-request-lookup-worker.mts
          git commit -m "chore(competitive): fix CP3-I harness typing"
          git push
