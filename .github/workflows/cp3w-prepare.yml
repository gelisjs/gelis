name: CP3-W Prepare HTTP Revalidation

on:
  push:
    branches:
      - work/competitive-cp3w-http-revalidation

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP3W_PREPARE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Restore exact CP3-K competitive tree
        shell: bash
        run: |
          git checkout 42dbba8e20c45024524c805a717751cbc8dcddfb -- bench/competitive

      - name: Adapt CP3-W identity only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bench/competitive/candidate/http-revalidation-acceptance.mts')
          text = path.read_text()
          text = text.replace(
              '2a10e42308631fe53faba9a789b227d0a1cb241c',
              '979821c709e809e29018791ce0fe212cded04162',
          )
          text = text.replace(
              '98d8c00bfda8913a951bdf8780e136672646a90c',
              '8e43aad09759d60378b3fc174292850057ccfba3',
          )
          text = text.replace('CP3-K', 'CP3-W')
          path.write_text(text)
          PY

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd bench/competitive --frozen-lockfile
          bun install --cwd bench/competitive/elysia-v2-aot --frozen-lockfile

      - name: Format CP3-W files
        run: |
          bun ./node_modules/prettier/bin/prettier.cjs \
            bench/competitive/candidate/http-revalidation-acceptance.mts \
            docs/benchmarks/competitive-cp3w-http-revalidation-freeze.md \
            --write

      - name: Commit frozen HTTP harness locally
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/competitive docs/benchmarks/competitive-cp3w-http-revalidation-freeze.md
          git commit -m "bench(competitive): freeze CP3-W HTTP revalidation harness"

      - name: Verify candidate source guard
        shell: bash
        run: |
          git diff --quiet 979821c709e809e29018791ce0fe212cded04162 HEAD -- src

      - name: Run full repository quality gate
        run: bun run check

      - name: Run CP3-W correctness probe
        run: bun bench/competitive/candidate/http-revalidation-acceptance.mts --probe-only

      - name: Clean probe-generated AOT artifacts
        shell: bash
        run: |
          rm -rf bench/competitive/elysia-v2-aot/generated
          test -z "$(git status --porcelain --untracked-files=all | grep -v -E '^.. \.cp3w-prepare-trigger$|^.. \.github/workflows/cp3w-prepare.yml$' || true)"

      - name: Push accepted harness
        run: git push
