name: CP4-Q Format Evidence

on:
  push:
    branches:
      - work/competitive-cp4q-deferred-upper-bound-dispatch
    paths:
      - .cp4q-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4q-deferred-upper-bound-dispatch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/benchmarks/competitive-cp4p-local-authoritative.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp4p-local-authoritative.md
          git commit -m "docs(bench): format CP4-P authoritative evidence"
          git push origin HEAD:work/competitive-cp4q-deferred-upper-bound-dispatch
