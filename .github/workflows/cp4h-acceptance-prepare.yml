name: CP4-H Acceptance Prepare

on:
  push:
    branches:
      - work/competitive-cp4h-fast-map-primary-discriminator
    paths:
      - .cp4h-acceptance-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4h-fast-map-primary-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-H decomposition artifacts
        run: python .github/scripts/cp4h_acceptance_prepare.py
      - name: Format frozen artifacts
        run: bunx prettier --write bench/runtime/cp4h-fast-map-primary-acceptance.mts bench/runtime/cp4h-fast-map-primary-worker.mts docs/benchmarks/competitive-cp4h-fast-map-primary-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen decomposition artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4h-fast-map-primary-acceptance.mts bench/runtime/cp4h-fast-map-primary-worker.mts docs/benchmarks/competitive-cp4h-fast-map-primary-freeze.md
          git commit -m "bench(competitive): freeze CP4-H fast-map primary decomposition"
          git push origin HEAD:work/competitive-cp4h-fast-map-primary-discriminator
