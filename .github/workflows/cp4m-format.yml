name: CP4-M Format

on:
  push:
    branches:
      - work/competitive-cp4m-lineage-attribution
    paths:
      - .cp4m-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4m-lineage-attribution
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format CP4-M artifacts and inherited CP4-L evidence
        run: bunx prettier --write bench/runtime/cp4m-lineage-attribution.mts docs/benchmarks/competitive-cp4m-lineage-attribution-freeze.md docs/benchmarks/competitive-cp4l-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4m-lineage-attribution.mts docs/benchmarks/competitive-cp4m-lineage-attribution-freeze.md docs/benchmarks/competitive-cp4l-local-authoritative.md
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "bench(competitive): format CP4-M attribution artifacts"
            git push origin HEAD:work/competitive-cp4m-lineage-attribution
          fi
