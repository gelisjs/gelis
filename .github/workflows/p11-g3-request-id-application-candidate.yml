name: P11-G3 Request ID Application Candidate

on:
  push:
    branches:
      - work/p11-g3-request-id-application
    paths:
      - .github/workflows/p11-g3-request-id-application-candidate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply G3 application integration
        run: python scripts/p11-g3-request-id-application-patch.py

      - name: Format G3 files
        run: |
          bunx prettier --write src/runtime/application-http.ts src/request-id/index.ts test/runtime/request-id-application.test.ts

      - name: Targeted request ID tests
        run: bun test test/runtime/request-id-policy.test.ts test/runtime/request-id-application.test.ts

      - name: Full quality gate
        run: bun run check

      - name: Commit candidate and remove temporary generator
        run: |
          git rm .github/workflows/p11-g3-request-id-application-candidate.yml scripts/p11-g3-request-id-application-patch.py
          git add src/runtime/application-http.ts src/request-id/index.ts test/runtime/request-id-application.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(request-id): complete G3 application integration"
          git push origin HEAD:work/p11-g3-request-id-application
