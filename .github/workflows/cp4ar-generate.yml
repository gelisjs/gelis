name: CP4-AR generate

on:
  push:
    branches:
      - work/competitive-cp4ar-secondary-collision-fingerprint
    paths:
      - .github/workflows/cp4ar-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Patch candidate
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/runtime/router.ts')
          s = path.read_text()

          def repl(old, new):
              global s
              if old not in s:
                  raise SystemExit('expected source snippet not found:\n' + old[:240])
              s = s.replace(old, new, 1)

          repl('''interface TrailingFingerprintCollisionEntry {\n  readonly kind: "collision";\n\n  readonly routes: Map<string, TrailingParamRoute>;\n}\n''', '''interface TrailingSecondaryFingerprintUniqueEntry {\n  readonly prefix: string;\n\n  readonly trailingRoute: TrailingParamRoute;\n}\n\ntype TrailingSecondaryFingerprintEntry =\n  | TrailingSecondaryFingerprintUniqueEntry\n  | null;\n\ninterface TrailingFingerprintCollisionEntry {\n  readonly kind: "collision";\n\n  readonly routes: Map<string, TrailingParamRoute>;\n\n  readonly secondary?: Map<number, TrailingSecondaryFingerprintEntry>;\n}\n''')

          repl('''            } else if (entry !== undefined) {\n              trailingRoute = entry.routes.get(pathname.slice(0, prefixEnd));\n            }\n''', '''            } else if (entry !== undefined) {\n              const secondary = entry.secondary;\n\n              if (secondary === undefined) {\n                trailingRoute = entry.routes.get(pathname.slice(0, prefixEnd));\n              } else {\n                const secondaryEntry = secondary.get(\n                  secondaryPrefixFingerprint(pathname, prefixEnd),\n                );\n\n                if (secondaryEntry === null) {\n                  trailingRoute = entry.routes.get(pathname.slice(0, prefixEnd));\n                } else if (\n                  secondaryEntry !== undefined &&\n                  secondaryEntry.prefix.length === prefixEnd &&\n                  pathname.startsWith(secondaryEntry.prefix)\n                ) {\n                  trailingRoute = secondaryEntry.trailingRoute;\n                }\n              }\n            }\n''')

          repl('''            } else if (entry !== undefined) {\n              trailingRoute = entry.routes.get(url.slice(pathStart, prefixEnd));\n            }\n''', '''            } else if (entry !== undefined) {\n              const secondary = entry.secondary;\n\n              if (secondary === undefined) {\n                trailingRoute = entry.routes.get(url.slice(pathStart, prefixEnd));\n              } else {\n                const secondaryEntry = secondary.get(\n                  secondaryPrefixFingerprintRange(\n                    url,\n                    prefixEnd,\n                    prefixLength,\n                  ),\n                );\n\n                if (secondaryEntry === null) {\n                  trailingRoute = entry.routes.get(\n                    url.slice(pathStart, prefixEnd),\n                  );\n                } else if (\n                  secondaryEntry !== undefined &&\n                  secondaryEntry.prefix.length === prefixLength &&\n                  url.startsWith(secondaryEntry.prefix, pathStart)\n                ) {\n                  trailingRoute = secondaryEntry.trailingRoute;\n                }\n              }\n            }\n''')

          repl('''          if (\n            entry !== undefined &&\n            entry.routes.has(pathname.slice(0, prefixEnd))\n          ) {\n            return true;\n          }\n''', '''          if (entry !== undefined) {\n            const secondary = entry.secondary;\n\n            if (secondary === undefined) {\n              if (entry.routes.has(pathname.slice(0, prefixEnd))) {\n                return true;\n              }\n            } else {\n              const secondaryEntry = secondary.get(\n                secondaryPrefixFingerprint(pathname, prefixEnd),\n              );\n\n              if (secondaryEntry === null) {\n                if (entry.routes.has(pathname.slice(0, prefixEnd))) {\n                  return true;\n                }\n              } else if (\n                secondaryEntry !== undefined &&\n                secondaryEntry.prefix.length === prefixEnd &&\n                pathname.startsWith(secondaryEntry.prefix)\n              ) {\n                return true;\n              }\n            }\n          }\n''')

          repl('''    fingerprints.set(key, {\n      kind: "collision",\n\n      routes: new Map([\n        [existing.prefix, existing.trailingRoute],\n        [prefix, trailingRoute],\n      ]),\n    });\n''', '''    const secondary = new Map<number, TrailingSecondaryFingerprintEntry>();\n\n    registerTrailingSecondaryFingerprint(\n      secondary,\n      existing.prefix,\n      existing.trailingRoute,\n    );\n    registerTrailingSecondaryFingerprint(secondary, prefix, trailingRoute);\n\n    fingerprints.set(key, {\n      kind: "collision",\n\n      routes: new Map([\n        [existing.prefix, existing.trailingRoute],\n        [prefix, trailingRoute],\n      ]),\n\n      secondary,\n    });\n''')

          repl('''  existing.routes.set(prefix, trailingRoute);\n\n  return true;\n}\n\nfunction cloneTrailingParamFingerprints(\n''', '''  existing.routes.set(prefix, trailingRoute);\n\n  if (existing.secondary !== undefined) {\n    registerTrailingSecondaryFingerprint(\n      existing.secondary,\n      prefix,\n      trailingRoute,\n    );\n  }\n\n  return true;\n}\n\nfunction registerTrailingSecondaryFingerprint(\n  secondary: Map<number, TrailingSecondaryFingerprintEntry>,\n  prefix: string,\n  trailingRoute: TrailingParamRoute,\n): void {\n  const key = secondaryPrefixFingerprint(prefix, prefix.length);\n  const existing = secondary.get(key);\n\n  if (existing === undefined) {\n    secondary.set(key, { prefix, trailingRoute });\n    return;\n  }\n\n  if (existing !== null && existing.prefix !== prefix) {\n    secondary.set(key, null);\n  }\n}\n\nfunction cloneTrailingParamFingerprints(\n''')

          repl('''            kind: "collision",\n\n            routes: new Map(entry.routes),\n          },\n''', '''            kind: "collision",\n\n            routes: new Map(entry.routes),\n\n            ...(entry.secondary === undefined\n              ? {}\n              : { secondary: new Map(entry.secondary) }),\n          },\n''')

          repl('''function prefixFingerprintRange(\n  value: string,\n  absoluteEnd: number,\n  prefixLength: number,\n): number {\n  let hash = Math.imul(prefixLength, -1640531527);\n\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 2), -2048144789);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 3), -1028477387);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 4), 668265263);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 5), 374761393);\n\n  return hash | 0;\n}\n\nfunction codeBefore''', '''function prefixFingerprintRange(\n  value: string,\n  absoluteEnd: number,\n  prefixLength: number,\n): number {\n  let hash = Math.imul(prefixLength, -1640531527);\n\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 2), -2048144789);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 3), -1028477387);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 4), 668265263);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 5), 374761393);\n\n  return hash | 0;\n}\n\nfunction secondaryPrefixFingerprint(value: string, end: number): number {\n  let hash = Math.imul(end ^ 0x51ed270b, -1640531527);\n\n  hash = Math.imul(hash ^ codeBefore(value, end, 6), -2048144789);\n  hash = Math.imul(hash ^ codeBefore(value, end, 7), -1028477387);\n  hash = Math.imul(hash ^ codeBefore(value, end, 8), 668265263);\n  hash = Math.imul(hash ^ codeBefore(value, end, 9), 374761393);\n\n  return hash | 0;\n}\n\nfunction secondaryPrefixFingerprintRange(\n  value: string,\n  absoluteEnd: number,\n  prefixLength: number,\n): number {\n  let hash = Math.imul(prefixLength ^ 0x51ed270b, -1640531527);\n\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 6), -2048144789);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 7), -1028477387);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 8), 668265263);\n  hash = Math.imul(hash ^ codeBefore(value, absoluteEnd, 9), 374761393);\n\n  return hash | 0;\n}\n\nfunction codeBefore''')

          path.write_text(s)

          Path('test/runtime/router-secondary-fingerprint.test.ts').write_text('''import { describe, expect, test } from "bun:test";\n\nimport { Gelis } from "../../src";\n\ndescribe("secondary trailing fingerprint routing", () => {\n  test("resolves primary fingerprint collisions without changing route identity", async () => {\n    const app = new Gelis();\n\n    for (let index = 0; index < 128; index++) {\n      const id = String(index).padStart(4, "0");\n      app.get(`/collision/${id}aaaa/:value`, ({ params }) =>\n        `${id}:${params.value}`,\n      );\n    }\n\n    for (const index of [0, 63, 127]) {\n      const id = String(index).padStart(4, "0");\n      const response = await app.fetch(\n        new Request(\n          `http://gelis.test/collision/${id}aaaa/value-${index}?source=test`,\n        ),\n      );\n\n      expect(await response.text()).toBe(`${id}:value-${index}`);\n    }\n\n    const missing = await app.fetch(\n      new Request("http://gelis.test/collision/9999aaaa/missing"),\n    );\n\n    expect(missing.status).toBe(404);\n  });\n\n  test("falls back to exact prefixes when the secondary fingerprint also collides", async () => {\n    const app = new Gelis();\n\n    app.get("/secondary/Axxxxxxxx/:id", ({ params }) => `A:${params.id}`);\n    app.get("/secondary/Bxxxxxxxx/:id", ({ params }) => `B:${params.id}`);\n\n    const a = await app.fetch(\n      new Request("http://gelis.test/secondary/Axxxxxxxx/42"),\n    );\n    const b = await app.fetch(\n      new Request("http://gelis.test/secondary/Bxxxxxxxx/42"),\n    );\n\n    expect(await a.text()).toBe("A:42");\n    expect(await b.text()).toBe("B:42");\n  });\n});\n''')
      - run: bunx prettier --write src/runtime/router.ts test/runtime/router-secondary-fingerprint.test.ts
      - run: bun run check
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts test/runtime/router-secondary-fingerprint.test.ts
          git commit -m "perf(router): add secondary collision fingerprint"
          git push
