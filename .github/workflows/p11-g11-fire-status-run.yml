name: P11-G11 fire status repair runner

on:
  push:
    branches:
      - work/p11-g11-timeout-enabled-acceptance
    paths:
      - .github/workflows/p11-g11-fire-status-run.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g11-timeout-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: python3 scripts/temp-p11-g11-fire-status-fix.py
      - run: bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g11-timeout-worker.mts
      - run: bun run typecheck:bench
      - run: bun run check
      - name: Commit repaired worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g11-timeout-worker.mts
          git commit -m "fix(bench): validate current Gelis timeout status"
          git push origin HEAD:work/p11-g11-timeout-enabled-acceptance
