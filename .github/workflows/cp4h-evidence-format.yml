name: CP4-H Evidence Format

on:
  push:
    branches:
      - work/competitive-cp4h-fast-map-primary-discriminator
    paths:
      - .cp4h-evidence-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4h-fast-map-primary-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/benchmarks/competitive-cp4h-local-authoritative.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp4h-local-authoritative.md
          git commit -m "docs(bench): format authoritative CP4-H evidence"
          git push origin HEAD:work/competitive-cp4h-fast-map-primary-discriminator
