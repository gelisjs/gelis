name: CP4-AW Format Regression Test

on:
  push:
    branches:
      - work/competitive-cp4aw-shared-collision-param-name
    paths:
      - .github/workflows/cp4aw-format-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4aw-shared-collision-param-name

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format regression test
        run: bunx prettier --write test/runtime/router-secondary-fingerprint.test.ts

      - name: Validate
        run: bun run check

      - name: Commit formatted test and clean temporary workflow
        run: |
          rm .github/workflows/cp4aw-format-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/runtime/router-secondary-fingerprint.test.ts .github/workflows/cp4aw-format-test.yml
          git commit -m "style: format CP4-AW regression test"
          git push origin HEAD:work/competitive-cp4aw-shared-collision-param-name
