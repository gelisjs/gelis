name: CP4-AN Source Prepare

on:
  push:
    branches:
      - work/cp4an-all-only-method-miss-elision-source
    paths:
      - .cp4an-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/cp4an-all-only-method-miss-elision-source
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply ALL-only method-miss elision
        run: python .github/scripts/cp4an_all_only_method_miss_elision.py
      - name: Format candidate source
        run: bunx prettier --write src/runtime/router.ts src/runtime/router-all.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts src/runtime/router-all.ts
          git commit -m "perf(router): elide method miss for ALL-only topology"
          git push origin HEAD:work/cp4an-all-only-method-miss-elision-source
