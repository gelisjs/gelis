name: P11-G11 generate timeout acceptance harness

on:
  push:
    branches:
      - work/p11-g11-timeout-enabled-acceptance
    paths:
      - .github/workflows/p11-g11-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g11-timeout-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Materialize and adapt timeout harness
        shell: bash
        run: |
          git fetch origin work/p11-g10-timeout-competitor
          mkdir -p bench/request-id-timeout
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-acceptance.mts > bench/request-id-timeout/p11-g11-timeout-acceptance.mts
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-worker.mts > bench/request-id-timeout/p11-g11-timeout-worker.mts
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-http-server.mts > bench/request-id-timeout/p11-g11-timeout-http-server.mts
          python3 - <<'PY'
          from pathlib import Path

          candidate = "8483fe31f96a1965ace152295bbdaefa77a6fce8"
          branch = Path("bench/request-id-timeout")
          acceptance = branch / "p11-g11-timeout-acceptance.mts"
          worker = branch / "p11-g11-timeout-worker.mts"
          server = branch / "p11-g11-timeout-http-server.mts"

          for path in (acceptance, worker, server):
              text = path.read_text()
              text = text.replace("p11-g10-timeout", "p11-g11-timeout")
              text = text.replace("P11-G10", "P11-G11")
              path.write_text(text)

          text = acceptance.read_text()
          text = text.replace(
              'import { cpus } from "node:os";',
              'import { readFileSync, rmSync } from "node:fs";\nimport { cpus } from "node:os";',
              1,
          )
          text = text.replace(
              'const CANDIDATE_SHA = "1dd5f94cf0e9ad884ca44e537ee287587cd8baab";',
              'const EXPECTED_BUN = "1.4.2";\nconst EXPECTED_BUN_REVISION = "744846f844374847c902b5e7fd59b4342a51ef99";\nconst EXPECTED_LOCAL_LOGICAL_CPUS = 12;\nconst CANDIDATE_SHA = "' + candidate + '";',
              1,
          )
          old_init = '''const options = readOptions(process.argv.slice(2));
          const candidateRoot = resolve(ROOT, options.candidateRoot);
          const candidateSha = gitHead(candidateRoot);

          if (candidateSha !== CANDIDATE_SHA) {
            throw new Error(
              `P11-G11 candidate must be ${CANDIDATE_SHA}, received ${candidateSha}`,
            );
          }

          assertCleanWorkingTree(candidateRoot);'''.replace("          ", "")
          new_init = '''const options = readOptions(process.argv.slice(2));
          const candidateRoot = resolve(ROOT, options.candidateRoot);
          const candidateSha = CANDIDATE_SHA;
          const probeOnly = process.argv.includes("--probe-only");
          const harnessSha = gitHead(ROOT);
          const logicalCpuCount = cpus().length;
          const affinityLogicalCpu = Math.max(0, logicalCpuCount - 2);
          const affinityMaskHex = (1n << BigInt(affinityLogicalCpu)).toString(16);
          let workerResultSequence = 0;

          preflight(candidateRoot);'''.replace("          ", "")
          if text.count(old_init) != 1:
              raise SystemExit(f"acceptance init anchor count {text.count(old_init)}")
          text = text.replace(old_init, new_init, 1)

          old_header = '''console.log("P11-G11 Timeout Hono + HTTP + Route-Scale Acceptance");
          console.log(`Bun:       ${Bun.version}`);
          console.log(`CPU:       ${cpus()[0]?.model ?? "unknown"}`);
          console.log(`Candidate: ${candidateSha}`);
          console.log(`Hono:      ${honoVersion}`);
          console.log(`oha:       ${ohaVersion}`);
          console.log(
            `Direct:    ${DIRECT_SAMPLE_COUNT} mirrored fresh-process pairs per case`,
          );
          console.log(
            `HTTP:      ${HTTP_SAMPLE_COUNT} alternating pairs, ${HTTP_CONNECTIONS} connections`,
          );
          console.log(
            `Scale:     ${ROUTE_SCALE_SAMPLE_COUNT} mirrored fresh-process 5000/1000 pairs\\n`,
          );'''.replace("          ", "")
          new_header = '''console.log("P11-G11 Timeout Hono + HTTP + Route-Scale Acceptance");
          console.log(`Bun:       ${Bun.version}`);
          console.log(`Revision:  ${Bun.revision}`);
          console.log(`CPU:       ${cpus()[0]?.model ?? "unknown"}`);
          console.log(`Logical:   ${logicalCpuCount}`);
          console.log(`Harness:   ${harnessSha}`);
          console.log(`Candidate: ${candidateSha}`);
          console.log(`Hono:      ${honoVersion}`);
          console.log(`oha:       ${ohaVersion}`);
          console.log(
            `Direct:    ${DIRECT_SAMPLE_COUNT} mirrored fresh-process pairs per case`,
          );
          console.log(
            `HTTP:      ${HTTP_SAMPLE_COUNT} alternating pairs, ${HTTP_CONNECTIONS} connections`,
          );
          console.log(
            `Scale:     ${ROUTE_SCALE_SAMPLE_COUNT} mirrored fresh-process 5000/1000 pairs`,
          );
          if (probeOnly) {
            console.log("Mode:       correctness probe only\\n");
          } else {
            console.log(
              `Affinity:   logical CPU ${affinityLogicalCpu} (0x${affinityMaskHex}), HIGH direct/scale workers\\n`,
            );
          }'''.replace("          ", "")
          if text.count(old_header) != 1:
              raise SystemExit(f"acceptance header anchor count {text.count(old_header)}")
          text = text.replace(old_header, new_header, 1)

          marker = '''console.log(
            "Timeout successful-under-deadline direct comparison vs Hono 4.13.5",
          );'''.replace("          ", "")
          probe = '''if (probeOnly) {
            let checks = 0;
            for (const scenario of directScenarios) {
              await runDirectWorker("gelis", scenario, candidateRoot);
              console.log(`PASS gelis-${scenario}`);
              checks++;
              await runDirectWorker("hono", scenario, candidateRoot);
              console.log(`PASS hono-${scenario}`);
              checks++;
            }

            await runFireWorker("gelis", candidateRoot);
            console.log("PASS gelis-timeout-fire");
            checks++;
            await runFireWorker("hono", candidateRoot);
            console.log("PASS hono-timeout-fire");
            checks++;

            await probeHttpFramework("gelis", candidateRoot);
            console.log("PASS gelis-http-application-timeout");
            checks++;
            await probeHttpFramework("hono", candidateRoot);
            console.log("PASS hono-http-application-timeout");
            checks++;

            await runRouteScaleWorker(1_000, candidateRoot);
            console.log("PASS gelis-route-scale-1000");
            checks++;
            await runRouteScaleWorker(5_000, candidateRoot);
            console.log("PASS gelis-route-scale-5000");
            checks++;

            await probeCombinedGelis(candidateRoot, false);
            console.log("PASS gelis-combined-request-id-timeout-success");
            checks++;
            await probeCombinedGelis(candidateRoot, true);
            console.log("PASS gelis-combined-request-id-timeout-fire");
            checks++;

            console.log();
            console.log(
              `P11-G11 TIMEOUT CORRECTNESS PROBE: PASS (${checks}/16 framework checks)`,
            );
            process.exit(0);
          }

          '''.replace("          ", "")
          if text.count(marker) != 1:
              raise SystemExit(f"acceptance direct marker count {text.count(marker)}")
          text = text.replace(marker, probe + marker, 1)

          old_worker = '''async function runWorker(args: readonly string[]): Promise<WorkerResult> {
            const child = Bun.spawn([process.execPath, WORKER, ...args], {
              cwd: ROOT,
              stdout: "pipe",
              stderr: "pipe",
            });

            const stdoutPromise = new Response(child.stdout).text();
            const stderrPromise = new Response(child.stderr).text();
            const exitCode = await child.exited;
            const [stdout, stderr] = await Promise.all([stdoutPromise, stderrPromise]);

            if (exitCode !== 0) {
              throw new Error(
                ["P11-G11 benchmark worker failed", ...args, stdout, stderr].join("\\n"),
              );
            }

            const lines = stdout
              .trim()
              .split(/\\r?\\n/u)
              .filter((line) => line.length > 0);
            const last = lines.at(-1);

            if (last === undefined) {
              throw new Error("P11-G11 worker emitted no JSON");
            }

            const parsed: unknown = JSON.parse(last);
            if (!isWorkerResult(parsed)) {
              throw new Error(`Invalid P11-G11 worker result: ${last}`);
            }

            return parsed;
          }'''.replace("          ", "")
          new_worker = '''async function runWorker(args: readonly string[]): Promise<WorkerResult> {
            const output =
              !probeOnly && process.platform === "win32"
                ? await runPinnedWindowsWorker(args)
                : await runPortableWorker(args);

            const lines = output
              .trim()
              .split(/\\r?\\n/u)
              .filter((line) => line.length > 0);
            const last = lines.at(-1);

            if (last === undefined) {
              throw new Error("P11-G11 worker emitted no JSON");
            }

            const parsed: unknown = JSON.parse(last);
            if (!isWorkerResult(parsed)) {
              throw new Error(`Invalid P11-G11 worker result: ${last}`);
            }

            return parsed;
          }

          async function runPortableWorker(args: readonly string[]): Promise<string> {
            const child = Bun.spawn([process.execPath, WORKER, ...args], {
              cwd: ROOT,
              stdout: "pipe",
              stderr: "pipe",
            });
            const stdoutPromise = new Response(child.stdout).text();
            const stderrPromise = new Response(child.stderr).text();
            const exitCode = await child.exited;
            const [stdout, stderr] = await Promise.all([stdoutPromise, stderrPromise]);
            if (exitCode !== 0) {
              throw new Error(
                ["P11-G11 benchmark worker failed", ...args, stdout, stderr].join("\\n"),
              );
            }
            return stdout;
          }

          async function runPinnedWindowsWorker(
            args: readonly string[],
          ): Promise<string> {
            const resultFile = resolve(
              ROOT,
              "..",
              `gelis-p11-g11-worker-${process.pid}-${Date.now()}-${workerResultSequence++}.txt`,
            );
            const errorFile = `${resultFile}.err`;
            const gateFile = `${resultFile}.gate`;
            const bunPath = quotePowerShell(process.execPath);
            const argumentList = [WORKER, ...args, `--launch-gate=${gateFile}`]
              .map(quotePowerShell)
              .join(", ");
            const command = [
              "$ErrorActionPreference = 'Stop'",
              `try { $arguments = @(${argumentList}); $p = Start-Process -FilePath ${bunPath} -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput ${quotePowerShell(resultFile)} -RedirectStandardError ${quotePowerShell(errorFile)}`,
              "Start-Sleep -Milliseconds 25",
              "$p.Refresh()",
              `$p.ProcessorAffinity = [IntPtr]0x${affinityMaskHex}`,
              "$p.PriorityClass = 'High'",
              `[IO.File]::WriteAllText(${quotePowerShell(gateFile)}, 'go')`,
              "$p.WaitForExit()",
              "$code = $p.ExitCode",
              "exit $code } finally { }",
            ].join("; ");

            const shell = Bun.spawn(
              [
                "powershell.exe",
                "-NoLogo",
                "-NoProfile",
                "-NonInteractive",
                "-Command",
                command,
              ],
              { cwd: ROOT, stdout: "ignore", stderr: "pipe" },
            );
            const shellErrorPromise = new Response(shell.stderr).text();
            const exitCode = await shell.exited;
            const shellError = await shellErrorPromise;

            let stdout = "";
            let stderr = shellError;
            try {
              if (exitCode === 0) stdout = readFileSync(resultFile, "utf8");
              try {
                stderr += readFileSync(errorFile, "utf8");
              } catch {
                /* optional */
              }
            } finally {
              rmSync(resultFile, { force: true });
              rmSync(errorFile, { force: true });
              rmSync(gateFile, { force: true });
            }

            if (exitCode !== 0) {
              throw new Error(
                ["P11-G11 pinned worker failed", ...args, stdout, stderr].join("\\n"),
              );
            }
            return stdout;
          }'''.replace("          ", "")
          if text.count(old_worker) != 1:
              raise SystemExit(f"acceptance runWorker anchor count {text.count(old_worker)}")
          text = text.replace(old_worker, new_worker, 1)

          old_read = '''function readOptions(values: readonly string[]): Options {
            let candidateRoot: string | undefined;

            for (const value of values) {
              if (value.startsWith("--candidate-root=")) {
                candidateRoot = value.slice("--candidate-root=".length);
              }
            }

            return { candidateRoot: candidateRoot ?? "." };
          }'''.replace("          ", "")
          preflight = '''function readOptions(values: readonly string[]): Options {
            let candidateRoot: string | undefined;

            for (const value of values) {
              if (value.startsWith("--candidate-root=")) {
                candidateRoot = value.slice("--candidate-root=".length);
              }
            }

            return { candidateRoot: candidateRoot ?? "." };
          }

          function preflight(candidate: string): void {
            if (Bun.version !== EXPECTED_BUN) {
              throw new Error(`P11-G11 requires Bun ${EXPECTED_BUN}, got ${Bun.version}`);
            }
            if (Bun.revision !== EXPECTED_BUN_REVISION) {
              throw new Error(
                `P11-G11 requires Bun revision ${EXPECTED_BUN_REVISION}, got ${Bun.revision}`,
              );
            }
            assertCleanWorkingTree(candidate);
            const sourceDiff = Bun.spawnSync(
              ["git", "diff", "--quiet", CANDIDATE_SHA, "--", "src"],
              { cwd: candidate, stdout: "pipe", stderr: "pipe" },
            );
            if (sourceDiff.exitCode !== 0) {
              throw new Error(
                "P11-G11 harness src/** must be byte-equivalent to frozen candidate",
              );
            }
            if (!probeOnly) {
              if (process.platform !== "win32") {
                throw new Error(
                  "P11-G11 timed acceptance is authoritative only on Windows",
                );
              }
              if (logicalCpuCount !== EXPECTED_LOCAL_LOGICAL_CPUS) {
                throw new Error(
                  `P11-G11 timed acceptance requires ${EXPECTED_LOCAL_LOGICAL_CPUS} logical CPUs, got ${logicalCpuCount}`,
                );
              }
            }
          }

          function quotePowerShell(value: string): string {
            return `'${value.replaceAll("'", "''")}'`;
          }'''.replace("          ", "")
          if text.count(old_read) != 1:
              raise SystemExit(f"acceptance readOptions anchor count {text.count(old_read)}")
          text = text.replace(old_read, preflight, 1)

          completion_anchor = '''if (!accepted) {
            process.exitCode = 1;
          }'''.replace("          ", "")
          completion = completion_anchor + '''

          console.log();
          console.log("P11-G11 TIMEOUT HONO + HTTP + ROUTE-SCALE LOCAL ACCEPTANCE RUN: COMPLETE");'''.replace("          ", "")
          if text.count(completion_anchor) != 1:
              raise SystemExit(f"completion anchor count {text.count(completion_anchor)}")
          text = text.replace(completion_anchor, completion, 1)

          # Add lightweight HTTP and combined correctness helpers before runMirroredFrameworks.
          helper_anchor = 'async function runMirroredFrameworks('
          helpers = '''async function probeHttpFramework(
            framework: Framework,
            candidate: string,
          ): Promise<void> {
            const server = Bun.spawn([process.execPath, HTTP_SERVER], {
              cwd: ROOT,
              env: {
                ...process.env,
                FRAMEWORK: framework,
                CANDIDATE_ROOT: candidate,
                PORT: String(HTTP_PORT),
              },
              stdout: "ignore",
              stderr: "pipe",
            });
            const stderrPromise = new Response(server.stderr).text();
            const url = `http://127.0.0.1:${HTTP_PORT}/resource`;
            try {
              await waitForServer(url, server);
              await verifyHttpResponse(url, framework);
            } finally {
              server.kill();
              await server.exited;
              await stderrPromise;
              await sleep(100);
            }
          }

          async function probeCombinedGelis(
            candidate: string,
            shouldTimeout: boolean,
          ): Promise<void> {
            const coreUrl = new URL(`file://${resolve(candidate, "src/index.ts").replaceAll("\\\\", "/")}`).href;
            const requestIdUrl = new URL(`file://${resolve(candidate, "src/request-id/index.ts").replaceAll("\\\\", "/")}`).href;
            const timeoutUrl = new URL(`file://${resolve(candidate, "src/timeout/index.ts").replaceAll("\\\\", "/")}`).href;
            const [coreModule, requestIdModule, timeoutModule] = await Promise.all([
              import(coreUrl) as Promise<{ Gelis: new () => any }>,
              import(requestIdUrl) as Promise<{ requestId: (options?: Record<string, unknown>) => any }>,
              import(timeoutUrl) as Promise<{ timeout: (options?: Record<string, unknown>) => any }>,
            ]);
            const app = new coreModule.Gelis();
            const ids = requestIdModule.requestId({ generator: () => "req_combined" });
            const deadlines = timeoutModule.timeout({ duration: shouldTimeout ? 5 : 60_000 });
            app.use(ids);
            app.use(deadlines);
            app.get("/resource", () =>
              shouldTimeout
                ? new Promise<Response>(() => {})
                : new Response(null, { status: 204 }),
            );
            const response = await app.fetch(new Request("http://gelis.test/resource"));
            const expectedStatus = shouldTimeout ? 503 : 204;
            if (response.status !== expectedStatus) {
              throw new Error(`combined Gelis status ${response.status}, expected ${expectedStatus}`);
            }
            if (response.headers.get("X-Request-Id") !== "req_combined") {
              throw new Error("combined Gelis response did not preserve request ID");
            }
          }

          '''.replace("          ", "")
          if text.count(helper_anchor) != 1:
              raise SystemExit(f"helper anchor count {text.count(helper_anchor)}")
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)
          acceptance.write_text(text)

          text = worker.read_text()
          text = text.replace(
              'import { resolve } from "node:path";',
              'import { readFileSync } from "node:fs";\nimport { resolve } from "node:path";',
              1,
          )
          text = text.replace(
              'readonly candidateRoot?: string | undefined;\n}',
              'readonly candidateRoot?: string | undefined;\n  readonly launchGate?: string | undefined;\n}',
              1,
          )
          args_anchor = 'const args = readArgs(process.argv.slice(2));\nconst mode = required(args.mode, "--mode") as Mode;'
          args_replacement = 'const args = readArgs(process.argv.slice(2));\n\nif (args.launchGate !== undefined) {\n  await waitForLaunchGate(args.launchGate);\n}\n\nconst mode = required(args.mode, "--mode") as Mode;'
          if text.count(args_anchor) != 1:
              raise SystemExit(f"worker args anchor count {text.count(args_anchor)}")
          text = text.replace(args_anchor, args_replacement, 1)

          text = text.replace(
              'options: { readonly timeout: number },',
              'options: { readonly timeout: unknown },',
              1,
          )
          old_direct_setup = '''  const { Gelis, timeout } = await importGelisTimeout(candidateRoot);
            const app = new Gelis();
            const applicationTimeout = scenario.startsWith("application-");
            const asynchronous = scenario.includes("-async-");

            app.use(
              applicationTimeout ? timeout({ duration: DIRECT_TIMEOUT_MS }) : timeout(),
            );'''.replace("            ", "")
          new_direct_setup = '''  const { Gelis, timeout } = await importGelisTimeout(candidateRoot);
            const app = new Gelis();
            const applicationTimeout = scenario.startsWith("application-");
            const asynchronous = scenario.includes("-async-");
            const deadlines = applicationTimeout
              ? timeout({ duration: DIRECT_TIMEOUT_MS })
              : timeout();

            app.use(deadlines);'''.replace("            ", "")
          if text.count(old_direct_setup) != 1:
              raise SystemExit(f"worker direct setup anchor count {text.count(old_direct_setup)}")
          text = text.replace(old_direct_setup, new_direct_setup, 1)
          text = text.replace(
              'app.get("/resource", { timeout: DIRECT_TIMEOUT_MS }, handler);',
              'app.get("/resource", { timeout: deadlines.route(DIRECT_TIMEOUT_MS) }, handler);',
              1,
          )
          old_scale = '''  const { Gelis, timeout } = await importGelisTimeout(candidateRoot);
            const app = new Gelis();

            app.use(timeout());'''.replace("            ", "")
          new_scale = '''  const { Gelis, timeout } = await importGelisTimeout(candidateRoot);
            const app = new Gelis();
            const deadlines = timeout();

            app.use(deadlines);'''.replace("            ", "")
          if text.count(old_scale) != 1:
              raise SystemExit(f"worker scale setup anchor count {text.count(old_scale)}")
          text = text.replace(old_scale, new_scale, 1)
          text = text.replace(
              '{ timeout: DIRECT_TIMEOUT_MS },',
              '{ timeout: deadlines.route(DIRECT_TIMEOUT_MS) },',
              1,
          )

          text = text.replace(
              '''  if (response.status !== 504) {
            throw new Error(
              `${framework} timeout-fire diagnostic returned ${response.status}`,
            );
          }'''.replace("          ", ""),
              '''  const expectedStatus = framework === "gelis" ? 503 : 504;
            if (response.status !== expectedStatus) {
              throw new Error(
                `${framework} timeout-fire diagnostic returned ${response.status}, expected ${expectedStatus}`,
              );
            }'''.replace("          ", ""),
              1,
          )

          old_import_type = '''  timeout: (options?: { readonly duration?: number }) => unknown;
          }>'''.replace("          ", "")
          new_import_type = '''  timeout: (options?: { readonly duration?: number }) => {
            route(duration: number): unknown;
          };
          }>'''.replace("          ", "")
          text = text.replace(old_import_type, new_import_type, 1)
          old_mod_type = '''      timeout: (options?: { readonly duration?: number }) => unknown;
              }>,'''.replace("              ", "")
          new_mod_type = '''      timeout: (options?: { readonly duration?: number }) => {
                route(duration: number): unknown;
              };
              }>,'''.replace("              ", "")
          text = text.replace(old_mod_type, new_mod_type, 1)

          text = text.replace(
              'candidateRoot: entries.get("candidate-root"),\n  };',
              'candidateRoot: entries.get("candidate-root"),\n    launchGate: entries.get("launch-gate"),\n  };',
              1,
          )
          wait_anchor = 'function required(value: string | undefined, name: string): string {'
          wait_helper = '''async function waitForLaunchGate(path: string): Promise<void> {
            const deadline = Date.now() + 10_000;
            while (Date.now() < deadline) {
              try {
                if (readFileSync(path, "utf8") === "go") return;
              } catch {
                // Parent creates the gate after affinity and priority are applied.
              }
              await Bun.sleep(2);
            }
            throw new Error(`P11-G11 launch gate timeout: ${path}`);
          }

          '''.replace("          ", "")
          if text.count(wait_anchor) != 1:
              raise SystemExit(f"worker wait anchor count {text.count(wait_anchor)}")
          text = text.replace(wait_anchor, wait_helper + wait_anchor, 1)
          worker.write_text(text)
          PY
          bunx prettier@3.9.6 --write \
            bench/request-id-timeout/p11-g11-timeout-acceptance.mts \
            bench/request-id-timeout/p11-g11-timeout-worker.mts \
            bench/request-id-timeout/p11-g11-timeout-http-server.mts
          git diff --check
          bun run typecheck:bench
          bun run check
      - name: Commit clean harness candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g11-timeout-acceptance.mts bench/request-id-timeout/p11-g11-timeout-worker.mts bench/request-id-timeout/p11-g11-timeout-http-server.mts
          git commit -m "bench(timeout): prepare P11-G11 enabled acceptance"
          git push origin HEAD:work/p11-g11-timeout-enabled-acceptance
