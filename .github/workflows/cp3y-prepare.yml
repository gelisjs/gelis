name: CP3-Y Prepare

on:
  push:
    branches:
      - work/competitive-cp3y-post-promotion-rebaseline

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP3Y_PREPARE'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp3y-post-promotion-rebaseline
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format CP3-Y files
        run: |
          bunx prettier --write \
            bench/runtime/cp3y-post-promotion-rebaseline-worker.mts \
            bench/runtime/cp3y-post-promotion-rebaseline-acceptance.mts \
            docs/benchmarks/competitive-cp3y-post-promotion-rebaseline-freeze.md
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add bench/runtime/cp3y-post-promotion-rebaseline-worker.mts \
              bench/runtime/cp3y-post-promotion-rebaseline-acceptance.mts \
              docs/benchmarks/competitive-cp3y-post-promotion-rebaseline-freeze.md
            git commit -m "chore(competitive): format CP3-Y harness"
            git push origin HEAD:work/competitive-cp3y-post-promotion-rebaseline
          fi
      - name: Full quality
        run: bun run check
      - name: CP3-Y correctness probe
        run: bun bench/runtime/cp3y-post-promotion-rebaseline-acceptance.mts --probe-only
      - name: Verify source guard
        run: git diff --quiet af4e5102046def1b163435333563b8d08f919bf5 HEAD -- src
