name: P11-G10 repair Windows worker launch

on:
  push:
    branches:
      - work/p11-g10-request-id-enabled-acceptance
    paths:
      - .github/workflows/p11-g10-fix-windows-worker-launch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g10-request-id-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Patch pinned Windows worker arguments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bench/request-id-timeout/p11-g10-request-id-acceptance.mts')
          text = path.read_text()
          old = 'const argumentList = [...args, `--launch-gate=${gateFile}`]'
          new = 'const argumentList = [WORKER, ...args, `--launch-gate=${gateFile}`]'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Windows worker argument anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g10-request-id-acceptance.mts
      - name: Commit repaired acceptance harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g10-request-id-acceptance.mts
          git commit -m "fix(bench): launch P11-G10 worker on Windows"
          git push origin HEAD:work/p11-g10-request-id-enabled-acceptance