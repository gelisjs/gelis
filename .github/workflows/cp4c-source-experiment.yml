name: CP4-C Source Experiment Prepare

on:
  push:
    branches:
      - work/competitive-cp4c-static-length-discriminator

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4C_SOURCE_EXPERIMENT_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4c-static-length-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-C diagnostic source experiment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/router.ts')
          text = path.read_text()

          old = '''export interface MethodRoutes {
  readonly staticRoutes: Map<string, RuntimeRouteRecord>;

  trailingParamRoutes: Map<string, TrailingParamRoute> | undefined;
'''
          new = '''export interface MethodRoutes {
  readonly staticRoutes: Map<string, RuntimeRouteRecord>;

  staticPathLengths?: Set<number>;

  trailingParamRoutes: Map<string, TrailingParamRoute> | undefined;
'''
          if old not in text:
              raise SystemExit('MethodRoutes anchor missing')
          text = text.replace(old, new, 1)

          old = '''  matchRequestUrl(method: string, url: string): RuntimeRouteMatch | undefined {
    const table = this.#methods.get(method);

    if (!table) {
      return undefined;
    }

    let authorityStart: number;
'''
          new = '''  matchRequestUrl(method: string, url: string): RuntimeRouteMatch | undefined {
    const table = this.#methods.get(method);

    if (!table) {
      return undefined;
    }

    /*
     * Generic trie matching already requires a materialized pathname.
     * Avoid paying the full-URL offset parser before falling back to it.
     */
    if (table.usesDynamicTrie) {
      return this.match(method, pathnameFromRequestUrl(url));
    }

    let authorityStart: number;
'''
          if old not in text:
              raise SystemExit('matchRequestUrl header anchor missing')
          text = text.replace(old, new, 1)

          old = '''    const queryStart = url.indexOf("?", pathStart + 1);
    const pathEnd = queryStart === -1 ? url.length : queryStart;

    let pathname: string | undefined;

    /*
     * Preserve exact static precedence before every dynamic path.
     * Pure-dynamic method tables skip pathname slicing entirely.
     */
    if (table.staticRoutes.size !== 0) {
      pathname = url.slice(pathStart, pathEnd);

      const staticRoute = table.staticRoutes.get(pathname);

      if (staticRoute) {
        return {
          route: staticRoute,
          params: EMPTY_PARAMS,
        };
      }
    }

    if (!table.usesDynamicTrie) {
'''
          new = '''    const queryStart = url.indexOf("?", pathStart + 1);
    const pathEnd = queryStart === -1 ? url.length : queryStart;
    const pathLength = pathEnd - pathStart;

    let pathname: string | undefined;

    /*
     * Exact static precedence is only possible when at least one installed
     * static route has the same pathname length. Legacy/prebuilt tables that
     * do not carry the optional discriminator conservatively take the old
     * exact-static slice path.
     */
    if (table.staticRoutes.size !== 0) {
      const staticPathLengths = table.staticPathLengths;

      if (
        staticPathLengths === undefined ||
        staticPathLengths.has(pathLength)
      ) {
        pathname = url.slice(pathStart, pathEnd);

        const staticRoute = table.staticRoutes.get(pathname);

        if (staticRoute) {
          return {
            route: staticRoute,
            params: EMPTY_PARAMS,
          };
        }
      }
    }

    if (!table.usesDynamicTrie) {
'''
          if old not in text:
              raise SystemExit('static precedence anchor missing')
          text = text.replace(old, new, 1)

          old = '''function createMethodRoutes(): MethodRoutes {
  return {
    staticRoutes: new Map(),

    trailingParamRoutes: undefined,
'''
          new = '''function createMethodRoutes(): MethodRoutes {
  return {
    staticRoutes: new Map(),

    staticPathLengths: new Set(),

    trailingParamRoutes: undefined,
'''
          if old not in text:
              raise SystemExit('createMethodRoutes anchor missing')
          text = text.replace(old, new, 1)

          old = '''function cloneMethodRoutes(table: MethodRoutes): MethodRoutes {
  return {
    staticRoutes: new Map(table.staticRoutes),

    trailingParamRoutes:
'''
          new = '''function cloneMethodRoutes(table: MethodRoutes): MethodRoutes {
  return {
    staticRoutes: new Map(table.staticRoutes),

    ...(table.staticPathLengths === undefined
      ? {}
      : { staticPathLengths: new Set(table.staticPathLengths) }),

    trailingParamRoutes:
'''
          if old not in text:
              raise SystemExit('cloneMethodRoutes anchor missing')
          text = text.replace(old, new, 1)

          old = '''    table.staticRoutes.set(route.path, route);

    return;
'''
          new = '''    table.staticRoutes.set(route.path, route);
    table.staticPathLengths?.add(route.path.length);

    return;
'''
          if old not in text:
              raise SystemExit('static registration anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format experiment source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen diagnostic source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts
          git commit -m "perf(runtime): experiment with static path-length discriminator"
          git push origin HEAD:work/competitive-cp4c-static-length-discriminator
