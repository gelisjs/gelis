name: CP4-C Source Experiment Prepare

on:
  push:
    branches:
      - work/competitive-cp4c-static-length-discriminator

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4C_SOURCE_EXPERIMENT_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4c-static-length-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-C diagnostic source experiment
        run: python3 .github/scripts/cp4c_source_experiment.py
      - name: Format experiment source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen diagnostic source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts
          git commit -m "perf(runtime): experiment with static path-length discriminator"
          git push origin HEAD:work/competitive-cp4c-static-length-discriminator
