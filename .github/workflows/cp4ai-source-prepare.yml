name: CP4-AI Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4ai-lazy-request-url-capability
    paths:
      - .cp4ai-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ai-lazy-request-url-capability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply lazy request-URL capability candidate
        run: python .github/scripts/cp4ai_lazy_request_url_capability.py
      - name: Format candidate source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(router): activate request URL matching on dynamic routes"
          git push origin HEAD:work/competitive-cp4ai-lazy-request-url-capability
