name: P11-G10 Apply Prettier

on:
  push:
    branches:
      - diag/p11-g10-prettier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Checkout target branch
        run: |
          git fetch origin work/p11-g10-timeout-competitor
          git checkout -B work/p11-g10-timeout-competitor origin/work/p11-g10-timeout-competitor
      - run: bun install --frozen-lockfile
      - name: Apply authoritative Prettier formatting
        run: |
          bunx prettier \
            bench/request-id-timeout/p11-g10-timeout-acceptance.mts \
            bench/request-id-timeout/p11-g10-timeout-worker.mts \
            --write
          git diff --check
          git diff --exit-code -- bench/request-id-timeout/p11-g10-timeout-http-server.mts
      - name: Commit target branch
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "Rigent"
          git config user.email "127601320+rigenttio@users.noreply.github.com"
          git add \
            bench/request-id-timeout/p11-g10-timeout-acceptance.mts \
            bench/request-id-timeout/p11-g10-timeout-worker.mts
          git commit -m "style(bench): format P11-G10 timeout harness"
          git push origin HEAD:work/p11-g10-timeout-competitor
