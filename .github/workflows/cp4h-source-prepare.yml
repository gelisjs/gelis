name: CP4-H Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4h-fast-map-primary-discriminator
    paths:
      - .cp4h-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4h-fast-map-primary-discriminator
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-H source transform
        run: python .github/scripts/cp4h_fast_map_primary.py
      - name: Format changed source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(runtime): make fast-map kind primary discriminator"
          git push origin HEAD:work/competitive-cp4h-fast-map-primary-discriminator
