name: CP4-AC Freeze Attribution

on:
  push:
    branches:
      - work/competitive-cp4ac-production-z-ab-attribution
    paths:
      - .cp4ac-freeze-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: work/competitive-cp4ac-production-z-ab-attribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate frozen attribution artifacts
        run: python3 .github/scripts/cp4ac_freeze_attribution.py
      - name: Format permanent artifacts
        run: bunx prettier --write bench/runtime/cp4ac-production-z-ab-attribution.mts bench/runtime/cp4ac-production-z-ab-attribution-worker.mts docs/benchmarks/competitive-cp4ac-production-z-ab-attribution-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit permanent artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4ac-production-z-ab-attribution.mts bench/runtime/cp4ac-production-z-ab-attribution-worker.mts docs/benchmarks/competitive-cp4ac-production-z-ab-attribution-freeze.md
          git commit -m "bench: freeze CP4-AC balanced attribution"
          git push origin HEAD:work/competitive-cp4ac-production-z-ab-attribution
