name: P11-G11 generate timeout acceptance harness v2

on:
  push:
    branches:
      - work/p11-g11-timeout-enabled-acceptance
    paths:
      - .github/workflows/p11-g11-generate-v2.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g11-timeout-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Materialize historical timeout harness
        run: |
          git fetch origin work/p11-g10-timeout-competitor
          mkdir -p bench/request-id-timeout
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-acceptance.mts > bench/request-id-timeout/p11-g11-timeout-acceptance.mts
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-worker.mts > bench/request-id-timeout/p11-g11-timeout-worker.mts
          git show origin/work/p11-g10-timeout-competitor:bench/request-id-timeout/p11-g10-timeout-http-server.mts > bench/request-id-timeout/p11-g11-timeout-http-server.mts
      - name: Normalize legacy readOptions anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bench/request-id-timeout/p11-g11-timeout-acceptance.mts')
          text = path.read_text()
          old = '''function readOptions(values: readonly string[]): Options {
            let candidateRoot: string | undefined;

            for (const value of values) {
              if (value.startsWith("--candidate-root=")) {
                candidateRoot = value.slice("--candidate-root=".length);
              }
            }

            if (candidateRoot === undefined || candidateRoot.length === 0) {
              throw new Error("P11-G10 benchmark requires --candidate-root=<path>");
            }

            return { candidateRoot };
          }'''.replace('          ', '')
          new = '''function readOptions(values: readonly string[]): Options {
            let candidateRoot: string | undefined;

            for (const value of values) {
              if (value.startsWith("--candidate-root=")) {
                candidateRoot = value.slice("--candidate-root=".length);
              }
            }

            return { candidateRoot: candidateRoot ?? "." };
          }'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit(f'legacy readOptions anchor count {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Extract and run frozen generator logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p11-g11-generate.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/p11-g11-generator.py').write_text(script)
          PY
          python3 /tmp/p11-g11-generator.py
          bunx prettier@3.9.6 --write \
            bench/request-id-timeout/p11-g11-timeout-acceptance.mts \
            bench/request-id-timeout/p11-g11-timeout-worker.mts \
            bench/request-id-timeout/p11-g11-timeout-http-server.mts
          git diff --check
          bun run typecheck:bench
          bun run check
      - name: Commit harness candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bench/request-id-timeout/p11-g11-timeout-acceptance.mts \
            bench/request-id-timeout/p11-g11-timeout-worker.mts \
            bench/request-id-timeout/p11-g11-timeout-http-server.mts
          git commit -m "bench(timeout): prepare P11-G11 enabled acceptance"
          git push origin HEAD:work/p11-g11-timeout-enabled-acceptance
