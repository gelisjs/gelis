name: CP4-AB Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4ab-dead-routing-metadata-elimination

permissions:
  contents: write

jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'CP4AB_SOURCE_TRIGGER')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ab-dead-routing-metadata-elimination
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-AB transform
        run: python .github/scripts/cp4ab_dead_routing_metadata_elimination.py
      - name: Format changed source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(router): eliminate dead routing metadata"
          git push origin HEAD:work/competitive-cp4ab-dead-routing-metadata-elimination
