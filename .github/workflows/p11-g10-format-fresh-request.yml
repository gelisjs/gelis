name: P11-G10 format fresh request worker

on:
  push:
    branches:
      - work/p11-g10-request-id-enabled-acceptance
    paths:
      - .github/workflows/p11-g10-format-fresh-request.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g10-request-id-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g10-request-id-worker.mts
      - name: Commit formatted worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g10-request-id-worker.mts
          git commit -m "style(bench): format P11-G10 fresh request worker"
          git push origin HEAD:work/p11-g10-request-id-enabled-acceptance