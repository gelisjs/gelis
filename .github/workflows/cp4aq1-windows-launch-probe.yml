name: CP4-AQ1 Windows launch probe

on:
  push:
    branches:
      - work/competitive-cp4aq1-hardened-stability-calibration

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Probe pinned high-priority worker launch
        shell: cmd
        run: >-
          start "" /b /wait /high /affinity 1 bun
          bench\runtime\cp4aq1-hardened-stability-calibration-worker.mts
          --cell=static-only-raw --variant=candidate --source-root="%CD%" --probe-only=false
