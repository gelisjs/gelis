name: CP4-P Harness Freeze

on:
  push:
    branches:
      - work/competitive-cp4p-mixed-positive-packed-state
    paths:
      - .cp4p-harness-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4p-mixed-positive-packed-state
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-P permanent artifacts
        run: python .github/scripts/cp4p_harness_generate.py
      - name: Format artifacts
        run: bunx prettier --write bench/runtime/cp4p-mixed-positive-packed-state-acceptance.mts bench/runtime/cp4p-mixed-positive-packed-state-worker.mts docs/benchmarks/competitive-cp4p-mixed-positive-packed-state-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4p-mixed-positive-packed-state-acceptance.mts bench/runtime/cp4p-mixed-positive-packed-state-worker.mts docs/benchmarks/competitive-cp4p-mixed-positive-packed-state-freeze.md
          git commit -m "bench(competitive): freeze CP4-P mixed-positive packed-state viability"
          git push origin HEAD:work/competitive-cp4p-mixed-positive-packed-state
