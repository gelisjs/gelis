name: CP4-Q Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4q-deferred-upper-bound-dispatch-final
    paths:
      - .cp4q-final-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4q-deferred-upper-bound-dispatch-final
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-Q correctness probe only
        run: bun bench/runtime/cp4q-deferred-upper-bound-dispatch-acceptance.mts --probe-only
