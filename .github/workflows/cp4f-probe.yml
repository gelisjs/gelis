name: CP4-F Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4f-method-table-kind
    paths:
      - .cp4f-probe-trigger

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4f-method-table-kind
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: CP4-F correctness probe only
        run: bun bench/runtime/cp4f-method-table-kind-acceptance.mts --probe-only
