name: P11-G11 finalize clean timeout harness

on:
  push:
    branches:
      - work/p11-g11-timeout-enabled-acceptance
    paths:
      - .github/workflows/p11-g11-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g11-timeout-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply final fire-status correction
        run: |
          python3 scripts/temp-p11-g11-fire-status-fix.py
          bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g11-timeout-worker.mts
      - name: Remove all temporary artifacts
        run: |
          rm -f \
            .github/workflows/p11-g11-generate.yml \
            .github/workflows/p11-g11-generate-v2.yml \
            .github/workflows/p11-g11-fire-status-fix.yml \
            .github/workflows/p11-g11-fire-status-fix-v2.yml \
            .github/workflows/p11-g11-fire-status-run.yml \
            .github/workflows/p11-g11-finalize.yml \
            scripts/temp-p11-g11-fire-status-fix.py
      - run: git diff --check
      - run: bun run typecheck:bench
      - run: bun run check
      - name: Commit clean final harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bench(timeout): freeze P11-G11 enabled acceptance harness"
          git push origin HEAD:work/p11-g11-timeout-enabled-acceptance
