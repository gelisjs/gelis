name: CP4-AQ1B launcher smoke mode

on:
  push:
    branches:
      - work/competitive-cp4aq1b-powershell-launcher-stability-calibration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add launcher probe mode
        shell: python
        run: |
          from pathlib import Path

          path = Path('bench/runtime/cp4aq1b-hardened-stability-calibration.mts')
          text = path.read_text()

          text = text.replace(
            'const probeOnly = process.argv.includes("--probe-only");\n',
            'const probeOnly = process.argv.includes("--probe-only");\nconst launcherProbeOnly = process.argv.includes("--launcher-probe");\n',
          )
          text = text.replace(
            'let probeCompleted = false;\nlet completed = false;\n',
            'let probeCompleted = false;\nlet launcherProbeCompleted = false;\nlet completed = false;\n',
          )
          text = text.replace(
            '''  if (probeOnly) {
            runProbe();
            probeCompleted = true;
          } else {
            runTiming();
            completed = true;
          }
          ''',
            '''  if (probeOnly) {
            runProbe();
            probeCompleted = true;
          } else if (launcherProbeOnly) {
            runLauncherProbe();
            launcherProbeCompleted = true;
          } else {
            runTiming();
            completed = true;
          }
          ''',
          )
          text = text.replace(
            '''} else if (completed) {
            console.log();
            console.log("CP4-AQ1B LOCAL HARDENED STABILITY CALIBRATION RUN: COMPLETE");
          }
          ''',
            '''} else if (launcherProbeCompleted) {
            console.log();
            console.log("CP4-AQ1B WINDOWS LAUNCHER PROBE: PASS");
          } else if (completed) {
            console.log();
            console.log("CP4-AQ1B LOCAL HARDENED STABILITY CALIBRATION RUN: COMPLETE");
          }
          ''',
          )
          text = text.replace(
            '''  if (probeOnly) {
            console.log("Mode:            correctness probe only");
          } else {
            console.log(`Blocks:          ${BLOCKS}`);
          ''',
            '''  if (probeOnly) {
            console.log("Mode:            correctness probe only");
          } else if (launcherProbeOnly) {
            console.log("Mode:            Windows launcher infrastructure probe only");
            console.log(
              `Windows affinity: logical CPU ${affinityLogicalCpu} (0x${affinityMaskHex})`,
            );
            console.log("Worker priority: HIGH");
          } else {
            console.log(`Blocks:          ${BLOCKS}`);
          ''',
          )
          marker = '''function runTiming(): void {
          '''
          smoke = '''function runLauncherProbe(): void {
            const result = runWorker("static-only-raw", "a", false);
            if (result.probeOnly || result.metric === null || result.unit !== "ns/op") {
              throw new Error("Invalid Windows launcher probe result");
            }
            console.log("PASS pinned-high-priority-worker static-only-raw");
          }

          function runTiming(): void {
          '''
          if marker not in text:
            raise SystemExit('runTiming marker not found')
          text = text.replace(marker, smoke, 1)

          path.write_text(text)

          freeze_path = Path('docs/benchmarks/competitive-cp4aq1b-hardened-stability-calibration-freeze.md')
          freeze = freeze_path.read_text()
          freeze += '''

## Frozen launcher infrastructure probe

Before the first full timed calibration, the authoritative local host may run `--launcher-probe` once. This executes exactly one `static-only-raw` worker through the same final PowerShell launcher, affinity mask, and `HIGH` priority path used by the full timed calibration. Its metric is infrastructure-only and must not be interpreted, recorded, compared, or used as Gelis performance evidence. A failed launcher probe is not a timed calibration run. The first completed full run without `--probe-only` or `--launcher-probe` remains the authoritative AQ1B calibration run.
'''
          freeze_path.write_text(freeze)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq1b-hardened-stability-calibration.mts docs/benchmarks/competitive-cp4aq1b-hardened-stability-calibration-freeze.md
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/runtime/cp4aq1b-hardened-stability-calibration.mts docs/benchmarks/competitive-cp4aq1b-hardened-stability-calibration-freeze.md
          git commit -m "bench(competitive): add CP4-AQ1B launcher smoke mode"
          git push
