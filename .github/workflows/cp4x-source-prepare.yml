name: CP4-X Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4x-generic-table-request-specialization
    paths:
      - .cp4x-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4x-generic-table-request-specialization
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply generic table request specialization
        run: python .github/scripts/cp4x_generic_table_request_specialization.py
      - name: Format source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(runtime): specialize generic request matching by table"
          git push origin HEAD:work/competitive-cp4x-generic-table-request-specialization
