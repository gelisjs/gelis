name: CP4-P Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4p-mixed-positive-packed-state
    paths:
      - .cp4p-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4p-mixed-positive-packed-state
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-P correctness probe only
        run: bun bench/runtime/cp4p-mixed-positive-packed-state-acceptance.mts --probe-only
