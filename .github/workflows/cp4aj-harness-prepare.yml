name: CP4-AJ Harness Prepare

on:
  push:
    branches:
      - work/competitive-cp4aj-lazy-kind-primary-viability
    paths:
      - .cp4aj-harness-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4aj-lazy-kind-primary-viability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build frozen CP4-AJ viability harness
        run: python .github/scripts/cp4aj_build_viability_harness.py
      - name: Format frozen artifacts
        run: bunx prettier --write bench/runtime/cp4aj-lazy-kind-primary-viability.mts bench/runtime/cp4aj-lazy-kind-primary-viability-worker.mts docs/benchmarks/competitive-cp4aj-lazy-kind-primary-viability-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4aj-lazy-kind-primary-viability.mts bench/runtime/cp4aj-lazy-kind-primary-viability-worker.mts docs/benchmarks/competitive-cp4aj-lazy-kind-primary-viability-freeze.md
          git commit -m "bench(cp4aj): freeze lazy-kind composition viability"
          git push origin HEAD:work/competitive-cp4aj-lazy-kind-primary-viability
