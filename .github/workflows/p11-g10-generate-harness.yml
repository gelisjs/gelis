name: P11-G10 generate request-ID harness

on:
  push:
    branches:
      - work/p11-g10-request-id-enabled-acceptance
    paths:
      - .github/workflows/p11-g10-generate-harness.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g10-request-id-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Generate G10 harness from frozen reference design
        run: |
          git fetch origin dbfa2364bb95601f2e50f1c30e95f8be31e814d6
          git show dbfa2364bb95601f2e50f1c30e95f8be31e814d6:bench/request-id-timeout/p11-g9-request-id-acceptance.mts > bench/request-id-timeout/p11-g10-request-id-acceptance.mts
          git show dbfa2364bb95601f2e50f1c30e95f8be31e814d6:bench/request-id-timeout/p11-g9-request-id-worker.mts > bench/request-id-timeout/p11-g10-request-id-worker.mts
          git show dbfa2364bb95601f2e50f1c30e95f8be31e814d6:bench/request-id-timeout/p11-g9-request-id-http-server.mts > bench/request-id-timeout/p11-g10-request-id-http-server.mts
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('bench/request-id-timeout')
          acceptance = root / 'p11-g10-request-id-acceptance.mts'
          worker = root / 'p11-g10-request-id-worker.mts'
          server = root / 'p11-g10-request-id-http-server.mts'

          for path in (acceptance, worker, server):
              text = path.read_text()
              text = text.replace('p11-g9-request-id', 'p11-g10-request-id')
              text = text.replace('P11-G9', 'P11-G10')
              path.write_text(text)

          # Worker: add launch gate so affinity/priority are applied before benchmark setup.
          text = worker.read_text()
          text = 'import { readFileSync } from "node:fs";\n' + text
          text = text.replace(
              '  readonly candidateRoot?: string | undefined;\n}',
              '  readonly candidateRoot?: string | undefined;\n  readonly launchGate?: string | undefined;\n}',
          )
          text = text.replace(
              'const args = readArgs(process.argv.slice(2));\nconsole.log(JSON.stringify(await runRequestId(args)));',
              'const args = readArgs(process.argv.slice(2));\n\nif (args.launchGate !== undefined) {\n  await waitForLaunchGate(args.launchGate);\n}\n\nconsole.log(JSON.stringify(await runRequestId(args)));',
          )
          text = text.replace(
              '    candidateRoot: entries.get("candidate-root"),\n  };',
              '    candidateRoot: entries.get("candidate-root"),\n    launchGate: entries.get("launch-gate"),\n  };',
          )
          marker = 'async function calibrateAsync(operation: () => Promise<void>): Promise<number> {'
          gate_helper = '''async function waitForLaunchGate(path: string): Promise<void> {\n  const deadline = Date.now() + 10_000;\n  while (Date.now() < deadline) {\n    try {\n      if (readFileSync(path, "utf8") === "go") return;\n    } catch {\n      // Parent creates the gate after affinity and priority are applied.\n    }\n    await Bun.sleep(2);\n  }\n  throw new Error(`P11-G10 launch gate timeout: ${path}`);\n}\n\n'''
          if marker not in text:
              raise SystemExit('worker calibrate anchor missing')
          text = text.replace(marker, gate_helper + marker, 1)
          worker.write_text(text)

          # Acceptance: current candidate/runtime identity + local reproducibility + probe mode.
          text = acceptance.read_text()
          text = 'import { readFileSync, rmSync } from "node:fs";\n' + text
          text = text.replace(
              'const CANDIDATE_SHA = "4b9053d7efaec35e71d35b3fbb0cb5b97cba7b61";',
              'const EXPECTED_BUN = "1.4.2";\nconst EXPECTED_BUN_REVISION = "744846f844374847c902b5e7fd59b4342a51ef99";\nconst EXPECTED_LOCAL_LOGICAL_CPUS = 12;\nconst CANDIDATE_SHA = "8483fe31f96a1965ace152295bbdaefa77a6fce8";',
          )
          old_setup = '''const options = readOptions(process.argv.slice(2));\nconst candidateRoot = resolve(ROOT, options.candidateRoot);\nconst candidateSha = gitHead(candidateRoot);\n\nif (candidateSha !== CANDIDATE_SHA) {\n  throw new Error(\n    `P11-G10 candidate must be ${CANDIDATE_SHA}, received ${candidateSha}`,\n  );\n}\n\nassertCleanWorkingTree(candidateRoot);\n'''
          new_setup = '''const options = readOptions(process.argv.slice(2));\nconst candidateRoot = resolve(ROOT, options.candidateRoot);\nconst candidateSha = CANDIDATE_SHA;\nconst probeOnly = process.argv.includes("--probe-only");\nconst harnessSha = gitHead(ROOT);\nconst logicalCpuCount = cpus().length;\nconst affinityLogicalCpu = Math.max(0, logicalCpuCount - 2);\nconst affinityMaskHex = (1n << BigInt(affinityLogicalCpu)).toString(16);\nlet workerResultSequence = 0;\n\npreflight(candidateRoot);\n'''
          if old_setup not in text:
              raise SystemExit('acceptance setup anchor missing')
          text = text.replace(old_setup, new_setup, 1)

          text = text.replace(
              'console.log(`Bun:       ${Bun.version}`);\nconsole.log(`CPU:       ${cpus()[0]?.model ?? "unknown"}`);\nconsole.log(`Candidate: ${candidateSha}`);',
              'console.log(`Bun:       ${Bun.version}`);\nconsole.log(`Revision:  ${Bun.revision}`);\nconsole.log(`CPU:       ${cpus()[0]?.model ?? "unknown"}`);\nconsole.log(`Logical:   ${logicalCpuCount}`);\nconsole.log(`Harness:   ${harnessSha}`);\nconsole.log(`Candidate: ${candidateSha}`);',
          )
          text = text.replace(
              'console.log(\n  `HTTP:      ${HTTP_SAMPLE_COUNT} alternating pairs, ${HTTP_CONNECTIONS} connections\\n`,\n);',
              'console.log(\n  `HTTP:      ${HTTP_SAMPLE_COUNT} alternating pairs, ${HTTP_CONNECTIONS} connections`,\n);\nif (probeOnly) {\n  console.log("Mode:       correctness probe only\\n");\n} else {\n  console.log(`Affinity:   logical CPU ${affinityLogicalCpu} (0x${affinityMaskHex}), HIGH direct workers\\n`);\n}',
          )

          scenarios_anchor = '''const directScenarios: readonly RequestIdScenario[] = [\n  "default-generated",\n  "trusted-valid-inbound",\n  "invalid-inbound-fallback",\n  "custom-generator",\n];\n'''
          probe_block = scenarios_anchor + '''\nif (probeOnly) {\n  for (const scenario of directScenarios) {\n    await runWorker([\n      "--framework=gelis",\n      `--scenario=${scenario}`,\n      `--candidate-root=${candidateRoot}`,\n    ]);\n    console.log(`PASS gelis-${scenario}`);\n\n    await runWorker([\n      "--framework=hono",\n      `--scenario=${scenario}`,\n      `--candidate-root=${candidateRoot}`,\n    ]);\n    console.log(`PASS hono-${scenario}`);\n  }\n\n  await probeHttpFramework("gelis", candidateRoot);\n  console.log("PASS gelis-http-default-generated");\n  await probeHttpFramework("hono", candidateRoot);\n  console.log("PASS hono-http-default-generated");\n  console.log();\n  console.log("P11-G10 REQUEST-ID CORRECTNESS PROBE: PASS (10/10 framework checks)");\n  process.exit(0);\n}\n'''
          if scenarios_anchor not in text:
              raise SystemExit('direct scenarios anchor missing')
          text = text.replace(scenarios_anchor, probe_block, 1)

          # Replace direct worker launcher with a pinned Windows path for authoritative timing.
          pattern = re.compile(r'async function runWorker\(args: readonly string\[\]\): Promise<WorkerResult> \{.*?\n\}\n\nfunction isWorkerResult', re.S)
          replacement = '''async function runWorker(args: readonly string[]): Promise<WorkerResult> {\n  const output =\n    !probeOnly && process.platform === "win32"\n      ? await runPinnedWindowsWorker(args)\n      : await runPortableWorker(args);\n\n  const lines = output\n    .trim()\n    .split(/\\r?\\n/u)\n    .filter((line) => line.length > 0);\n  const last = lines.at(-1);\n\n  if (last === undefined) {\n    throw new Error("P11-G10 direct worker emitted no JSON");\n  }\n\n  const parsed: unknown = JSON.parse(last);\n  if (!isWorkerResult(parsed)) {\n    throw new Error(`Invalid P11-G10 worker result: ${last}`);\n  }\n\n  return parsed;\n}\n\nasync function runPortableWorker(args: readonly string[]): Promise<string> {\n  const child = Bun.spawn([process.execPath, WORKER, ...args], {\n    cwd: ROOT,\n    stdout: "pipe",\n    stderr: "pipe",\n  });\n  const stdoutPromise = new Response(child.stdout).text();\n  const stderrPromise = new Response(child.stderr).text();\n  const exitCode = await child.exited;\n  const [stdout, stderr] = await Promise.all([stdoutPromise, stderrPromise]);\n  if (exitCode !== 0) {\n    throw new Error(["P11-G10 direct benchmark worker failed", ...args, stdout, stderr].join("\\n"));\n  }\n  return stdout;\n}\n\nasync function runPinnedWindowsWorker(args: readonly string[]): Promise<string> {\n  const resultFile = resolve(\n    ROOT,\n    "..",\n    `gelis-p11-g10-worker-${process.pid}-${Date.now()}-${workerResultSequence++}.txt`,\n  );\n  const errorFile = `${resultFile}.err`;\n  const gateFile = `${resultFile}.gate`;\n  const bunPath = quotePowerShell(process.execPath);\n  const argumentList = [...args, `--launch-gate=${gateFile}`]\n    .map(quotePowerShell)\n    .join(", ");\n  const command = [\n    "$ErrorActionPreference = 'Stop'",\n    `try { $arguments = @(${argumentList}); $p = Start-Process -FilePath ${bunPath} -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput ${quotePowerShell(resultFile)} -RedirectStandardError ${quotePowerShell(errorFile)}`,\n    "Start-Sleep -Milliseconds 25",\n    "$p.Refresh()",\n    `$p.ProcessorAffinity = [IntPtr]0x${affinityMaskHex}`,\n    "$p.PriorityClass = 'High'",\n    `[IO.File]::WriteAllText(${quotePowerShell(gateFile)}, 'go')`,\n    "$p.WaitForExit()",\n    "$code = $p.ExitCode",\n    "exit $code } finally { }",\n  ].join("; ");\n\n  const shell = Bun.spawn([\n    "powershell.exe",\n    "-NoLogo",\n    "-NoProfile",\n    "-NonInteractive",\n    "-Command",\n    command,\n  ], { cwd: ROOT, stdout: "ignore", stderr: "pipe" });\n  const shellErrorPromise = new Response(shell.stderr).text();\n  const exitCode = await shell.exited;\n  const shellError = await shellErrorPromise;\n\n  let stdout = "";\n  let stderr = shellError;\n  try {\n    if (exitCode === 0) stdout = readFileSync(resultFile, "utf8");\n    try { stderr += readFileSync(errorFile, "utf8"); } catch { /* optional */ }\n  } finally {\n    rmSync(resultFile, { force: true });\n    rmSync(errorFile, { force: true });\n    rmSync(gateFile, { force: true });\n  }\n\n  if (exitCode !== 0) {\n    throw new Error(["P11-G10 pinned direct worker failed", ...args, stdout, stderr].join("\\n"));\n  }\n  return stdout;\n}\n\nfunction isWorkerResult'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('runWorker replacement failed')

          # Add cheap HTTP correctness probe without oha timing.
          http_anchor = 'async function runHttpFramework(\n'
          probe_http = '''async function probeHttpFramework(\n  framework: Framework,\n  candidate: string,\n): Promise<void> {\n  const server = Bun.spawn([process.execPath, HTTP_SERVER], {\n    cwd: ROOT,\n    env: {\n      ...process.env,\n      FRAMEWORK: framework,\n      CANDIDATE_ROOT: candidate,\n      PORT: String(HTTP_PORT),\n    },\n    stdout: "ignore",\n    stderr: "pipe",\n  });\n  const stderrPromise = new Response(server.stderr).text();\n  const url = `http://127.0.0.1:${HTTP_PORT}/resource`;\n  try {\n    await waitForServer(url, server);\n    await verifyHttpRequestId(url, framework);\n  } finally {\n    server.kill();\n    await server.exited;\n    await stderrPromise;\n    await sleep(100);\n  }\n}\n\n'''
          if http_anchor not in text:
              raise SystemExit('HTTP function anchor missing')
          text = text.replace(http_anchor, probe_http + http_anchor, 1)

          # Candidate-root option defaults to current harness root; candidate identity is source-blob checked.
          text = text.replace(
              '  if (candidateRoot === undefined || candidateRoot.length === 0) {\n    throw new Error("P11-G10 benchmark requires --candidate-root=<path>");\n  }\n\n  return { candidateRoot };',
              '  return { candidateRoot: candidateRoot ?? "." };',
          )

          # Add preflight and source equivalence helpers before gitHead.
          git_anchor = 'function gitHead(root: string): string {'
          preflight = '''function preflight(candidate: string): void {\n  if (Bun.version !== EXPECTED_BUN) {\n    throw new Error(`P11-G10 requires Bun ${EXPECTED_BUN}, got ${Bun.version}`);\n  }\n  if (Bun.revision !== EXPECTED_BUN_REVISION) {\n    throw new Error(`P11-G10 requires Bun revision ${EXPECTED_BUN_REVISION}, got ${Bun.revision}`);\n  }\n  assertCleanWorkingTree(candidate);\n  const sourceDiff = Bun.spawnSync([\n    "git",\n    "diff",\n    "--quiet",\n    CANDIDATE_SHA,\n    "--",\n    "src",\n  ], { cwd: candidate, stdout: "pipe", stderr: "pipe" });\n  if (sourceDiff.exitCode !== 0) {\n    throw new Error("P11-G10 harness src/** must be byte-equivalent to frozen candidate");\n  }\n  if (!probeOnly) {\n    if (process.platform !== "win32") {\n      throw new Error("P11-G10 timed acceptance is authoritative only on Windows");\n    }\n    if (logicalCpuCount !== EXPECTED_LOCAL_LOGICAL_CPUS) {\n      throw new Error(`P11-G10 timed acceptance requires ${EXPECTED_LOCAL_LOGICAL_CPUS} logical CPUs, got ${logicalCpuCount}`);\n    }\n  }\n}\n\nfunction quotePowerShell(value: string): string {\n  return `'${value.replaceAll("'", "''")}'`;\n}\n\n'''
          if git_anchor not in text:
              raise SystemExit('gitHead anchor missing')
          text = text.replace(git_anchor, preflight + git_anchor, 1)

          # Permanent completion marker for authoritative timed run.
          final_anchor = '''if (!accepted) {\n  process.exitCode = 1;\n}\n'''
          final_replacement = final_anchor + '''\nconsole.log();\nconsole.log("P11-G10 REQUEST-ID HONO + HTTP LOCAL ACCEPTANCE RUN: COMPLETE");\n'''
          if final_anchor not in text:
              raise SystemExit('final acceptance anchor missing')
          text = text.replace(final_anchor, final_replacement, 1)

          acceptance.write_text(text)
          PY
      - name: Format generated harness
        run: bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g10-request-id-acceptance.mts bench/request-id-timeout/p11-g10-request-id-worker.mts bench/request-id-timeout/p11-g10-request-id-http-server.mts
      - name: Run full quality gates
        run: bun run check
      - name: Commit clean G10 harness
        run: |
          rm .github/workflows/p11-g10-generate-harness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g10-request-id-acceptance.mts bench/request-id-timeout/p11-g10-request-id-worker.mts bench/request-id-timeout/p11-g10-request-id-http-server.mts .github/workflows/p11-g10-generate-harness.yml
          git commit -m "bench(request-id): add P11-G10 Hono and HTTP acceptance"
          git push origin HEAD:work/p11-g10-request-id-enabled-acceptance