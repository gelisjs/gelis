name: CP4-N Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4n-mixed-static-sublineage
    paths:
      - .cp4n-probe-trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4n-mixed-static-sublineage
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-N correctness probe only
        run: bun bench/runtime/cp4n-mixed-static-sublineage.mts --probe-only
