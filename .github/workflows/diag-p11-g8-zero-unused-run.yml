name: P11-G8 Zero-Unused Acceptance

on:
  push:
    branches:
      - diag/p11-g8-zero-unused-run

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Prepare frozen control and candidate worktrees
        shell: bash
        run: |
          git worktree add --detach ../p11-g8-control c6a65d639679464744ba3be21cfc8acb0f850d9a
          git worktree add --detach ../p11-g8-candidate 4b9053d7efaec35e71d35b3fbb0cb5b97cba7b61
          git -C ../p11-g8-control status --short
          git -C ../p11-g8-candidate status --short
      - name: Run frozen P11-G8 zero-unused gate
        run: |
          bun bench/request-id-timeout/p11-g8-zero-unused-acceptance.mts \
            --control-root=../p11-g8-control \
            --candidate-root=../p11-g8-candidate
