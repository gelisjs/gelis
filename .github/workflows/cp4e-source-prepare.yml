name: CP4-E Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4e-deferred-trailing-metadata

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4E_SOURCE_PREPARE_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4e-deferred-trailing-metadata
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-E source candidate
        run: git apply cp4e-source.patch
      - name: Format source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen CP4-E source candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts
          git commit -m "perf(runtime): defer trailing metadata reads after static lookup"
          git push origin HEAD:work/competitive-cp4e-deferred-trailing-metadata
