name: CP4-Y Correctness Probe

on:
  push:
    paths:
      - ".cp4y-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4y-direct-production-revalidation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-Y correctness probe only
        run: bun bench/runtime/cp4y-direct-production-revalidation-acceptance.mts --probe-only
