name: CP3-J Source Patch

on:
  push:
    branches:
      - work/competitive-cp3j-request-url-fastpath

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply request URL fast path call sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/app.ts'): [
                  ('import { pathnameFromUrl } from "./runtime/url";', 'import { pathnameFromRequestUrl } from "./runtime/url";'),
                  ('const pathname = pathnameFromUrl(request.url);', 'const pathname = pathnameFromRequestUrl(request.url);'),
              ],
              Path('src/runtime/application-http.ts'): [
                  ('import { pathnameFromUrl } from "./url";', 'import { pathnameFromRequestUrl } from "./url";'),
                  ('resolveMethods(pathnameFromUrl(request.url)),', 'resolveMethods(pathnameFromRequestUrl(request.url)),'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          bunx prettier \
            src/runtime/url.ts \
            src/app.ts \
            src/runtime/application-http.ts \
            test/runtime/url.test.ts \
            docs/benchmarks/competitive-cp3i-local-authoritative.md \
            --write

          bun run check

      - name: Commit candidate and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/runtime/url.ts \
            src/app.ts \
            src/runtime/application-http.ts \
            test/runtime/url.test.ts \
            docs/benchmarks/competitive-cp3i-local-authoritative.md
          git commit -m "perf(runtime): use request URL pathname fast path"
          git push
