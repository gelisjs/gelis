name: CP3-J Format Oracle

on:
  push:
    branches:
      - work/competitive-cp3j-request-url-fastpath

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format CP3-J harness
        shell: bash
        run: |
          bunx prettier \
            bench/runtime/cp3j-request-url-fastpath-worker.mts \
            bench/runtime/cp3j-request-url-fastpath-acceptance.mts \
            docs/benchmarks/competitive-cp3j-request-url-fastpath-freeze.md \
            --write

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            bench/runtime/cp3j-request-url-fastpath-worker.mts \
            bench/runtime/cp3j-request-url-fastpath-acceptance.mts \
            docs/benchmarks/competitive-cp3j-request-url-fastpath-freeze.md; then
            echo "No formatting changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              bench/runtime/cp3j-request-url-fastpath-worker.mts \
              bench/runtime/cp3j-request-url-fastpath-acceptance.mts \
              docs/benchmarks/competitive-cp3j-request-url-fastpath-freeze.md
            git commit -m "chore(competitive): format CP3-J harness"
          fi

      - name: Run full quality gate
        run: bun run check

      - name: Push formatting commit
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "chore(competitive): format CP3-J harness"; then
            git push
          else
            echo "Nothing to push"
          fi
