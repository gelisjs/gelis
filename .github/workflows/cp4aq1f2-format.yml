name: CP4-AQ1F2 format

on:
  push:
    branches:
      - work/competitive-cp4aq1f2-paired-cycle-variance
    paths:
      - .github/workflows/cp4aq1f2-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq1f2-in-process-paired-cycle-variance-decomposition.mts bench/runtime/cp4aq1f2-in-process-paired-cycle-variance-decomposition-worker.mts docs/benchmarks/competitive-cp4aq1f2-freeze.md
      - run: bun run typecheck:bench
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/runtime/cp4aq1f2-in-process-paired-cycle-variance-decomposition.mts bench/runtime/cp4aq1f2-in-process-paired-cycle-variance-decomposition-worker.mts docs/benchmarks/competitive-cp4aq1f2-freeze.md
          git commit -m "style(competitive): format CP4-AQ1F2 artifacts"
          git push
