name: CP4-R Harness Freeze

on:
  push:
    branches:
      - work/competitive-cp4r-upper-bound-sentinel-dispatch
    paths:
      - .cp4r-harness-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4r-upper-bound-sentinel-dispatch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-R permanent artifacts
        run: python .github/scripts/cp4r_harness_generate.py
      - name: Format artifacts
        run: bunx prettier --write bench/runtime/cp4r-upper-bound-sentinel-dispatch-acceptance.mts bench/runtime/cp4r-upper-bound-sentinel-dispatch-worker.mts docs/benchmarks/competitive-cp4r-upper-bound-sentinel-dispatch-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4r-upper-bound-sentinel-dispatch-acceptance.mts bench/runtime/cp4r-upper-bound-sentinel-dispatch-worker.mts docs/benchmarks/competitive-cp4r-upper-bound-sentinel-dispatch-freeze.md
          git commit -m "bench(competitive): freeze CP4-R upper-bound sentinel dispatch viability"
          git push origin HEAD:work/competitive-cp4r-upper-bound-sentinel-dispatch
