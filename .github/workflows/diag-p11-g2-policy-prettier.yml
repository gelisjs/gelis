name: P11-G2 Policy Prettier Diagnostic

on:
  push:
    branches:
      - diag/p11-g2-policy-prettier

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Show authoritative Prettier diff
        run: |
          bunx prettier src/request-id/policy.ts --write
          git diff -- src/request-id/policy.ts
