name: CP3-W Final Validation

on:
  push:
    branches:
      - work/competitive-cp3w-http-revalidation

jobs:
  validate:
    if: github.event.head_commit.message == 'CP3W_FINAL_VALIDATE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd bench/competitive --frozen-lockfile
          bun install --cwd bench/competitive/elysia-v2-aot --frozen-lockfile

      - name: Verify candidate source guard
        shell: bash
        run: git diff --quiet 979821c709e809e29018791ce0fe212cded04162 HEAD -- src

      - name: Run full repository quality gate
        run: bun run check

      - name: Run CP3-W correctness probe
        run: bun bench/competitive/candidate/http-revalidation-acceptance.mts --probe-only

      - name: Clean probe-generated AOT artifacts
        shell: bash
        run: |
          rm -rf bench/competitive/elysia-v2-aot/generated
          test -z "$(git status --porcelain --untracked-files=all | grep -v -E '^.. \.cp3w-finalize-trigger$|^.. \.github/workflows/cp3w-finalize.yml$' || true)"
