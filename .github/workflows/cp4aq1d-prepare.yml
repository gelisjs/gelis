name: CP4-AQ1D prepare

on:
  push:
    branches:
      - work/competitive-cp4aq1d-result-file-ipc-stability-calibration

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Transform AQ1C into AQ1D
        shell: python
        run: |
          from pathlib import Path
          import re

          old_h = Path('bench/runtime/cp4aq1c-hardened-stability-calibration.mts')
          old_w = Path('bench/runtime/cp4aq1c-hardened-stability-calibration-worker.mts')
          old_f = Path('docs/benchmarks/competitive-cp4aq1c-hardened-stability-calibration-freeze.md')
          new_h = Path('bench/runtime/cp4aq1d-hardened-stability-calibration.mts')
          new_w = Path('bench/runtime/cp4aq1d-hardened-stability-calibration-worker.mts')
          new_f = Path('docs/benchmarks/competitive-cp4aq1d-hardened-stability-calibration-freeze.md')

          old_h.rename(new_h)
          old_w.rename(new_w)
          old_f.rename(new_f)

          h = new_h.read_text()
          h = h.replace('CP4-AQ1C', 'CP4-AQ1D').replace('cp4aq1c', 'cp4aq1d')
          h = h.replace(
              'import { spawnSync } from "node:child_process";\n',
              'import { spawnSync } from "node:child_process";\nimport { readFileSync, rmSync } from "node:fs";\n',
              1,
          )
          h = h.replace(
              'let completed = false;\n',
              'let completed = false;\nlet workerResultSequence = 0;\n',
              1,
          )

          old_launcher = re.compile(r'function spawnPinnedWindowsWorker\(args: readonly string\[\]\) \{.*?\n\}\n\nfunction workerOptions\(\)', re.S)
          new_launcher = '''function spawnPinnedWindowsWorker(args: readonly string[]) {\n  const bunPath = quotePowerShell(process.execPath);\n  const resultFile = resolve(\n    REPOSITORY_ROOT,\n    "..",\n    `gelis-cp4aq1d-result-${process.pid}-${Date.now()}-${workerResultSequence++}.json`,\n  );\n  const argumentList = [...args, `--result-file=${resultFile}`]\n    .map(quotePowerShell)\n    .join(", ");\n  const command = [\n    "$ErrorActionPreference = 'Stop'",\n    "$err = [IO.Path]::GetTempFileName()",\n    "$gate = [IO.Path]::GetTempFileName()",\n    "Remove-Item -LiteralPath $gate -Force -ErrorAction SilentlyContinue",\n    `try { $arguments = @(${argumentList}); $arguments += ('--launch-gate=' + $gate); $p = Start-Process -FilePath ${bunPath} -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardError $err`,\n    "Start-Sleep -Milliseconds 25",\n    "$p.Refresh()",\n    `$p.ProcessorAffinity = [IntPtr]0x${affinityMaskHex}`,\n    "$p.PriorityClass = 'High'",\n    "[IO.File]::WriteAllText($gate, 'go')",\n    "$p.WaitForExit()",\n    "$code = $p.ExitCode",\n    "if (Test-Path $err) { [Console]::Error.Write([IO.File]::ReadAllText($err)) }",\n    "exit $code } finally { Remove-Item -LiteralPath $err,$gate -Force -ErrorAction SilentlyContinue }",\n  ].join("; ");\n\n  const launched = spawnSync(\n    "powershell.exe",\n    ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", command],\n    workerOptions(),\n  );\n\n  let resultText = "";\n  try {\n    if (launched.status === 0) {\n      resultText = readFileSync(resultFile, "utf8");\n    }\n  } catch (error) {\n    return {\n      ...launched,\n      status: 1,\n      stdout: "",\n      stderr: `${launched.stderr}\\nresult-file read failed: ${String(error)}`,\n    };\n  } finally {\n    rmSync(resultFile, { force: true });\n  }\n\n  return { ...launched, stdout: resultText };\n}\n\nfunction workerOptions()'''
          h, count = old_launcher.subn(new_launcher, h, count=1)
          if count != 1:
              raise SystemExit(f'launcher replacement count={count}')

          # Strengthen the infrastructure probe for the new IPC path.
          old_probe = re.compile(r'function runLauncherProbe\(\): void \{.*?\n\}\n\nfunction runTiming\(\): void \{', re.S)
          new_probe = '''function runLauncherProbe(): void {\n  let completed = 0;\n  for (let index = 0; index < 8; index++) {\n    const source: Source = index % 2 === 0 ? "a" : "b";\n    const hotpath = runWorker("static-only-raw", source, false);\n    if (hotpath.probeOnly || hotpath.metric === null || hotpath.unit !== "ns/op") {\n      throw new Error(`Invalid AQ1D hotpath IPC probe result ${index + 1}`);\n    }\n    completed++;\n\n    const memory = runWorker("static-memory", source === "a" ? "b" : "a", false);\n    if (memory.probeOnly || memory.metric === null || memory.unit !== "bytes") {\n      throw new Error(`Invalid AQ1D memory IPC probe result ${index + 1}`);\n    }\n    completed++;\n  }\n  console.log(`PASS gated-result-file IPC stress probe (${completed}/16)`);\n}\n\nfunction runTiming(): void {'''
          h, count = old_probe.subn(new_probe, h, count=1)
          if count != 1:
              raise SystemExit(f'launcher probe replacement count={count}')
          h = h.replace('CP4-AQ1D WINDOWS LAUNCHER PROBE: PASS (2/2)', 'CP4-AQ1D WINDOWS LAUNCHER IPC PROBE: PASS (16/16)', 1)
          new_h.write_text(h)

          w = new_w.read_text()
          w = w.replace('CP4-AQ1C', 'CP4-AQ1D').replace('cp4aq1c', 'cp4aq1d')
          w = w.replace(
              'import { readFileSync } from "node:fs";\n',
              'import { readFileSync, writeFileSync } from "node:fs";\n',
              1,
          )
          w = w.replace(
              'const launchGate = args.launchGate;\n',
              'const launchGate = args.launchGate;\nconst resultFile = args.resultFile;\n',
              1,
          )
          w = w.replace('console.log(JSON.stringify(result));', 'emitResult(result, resultFile);')
          w = w.replace(
              '  readonly launchGate: string | undefined;\n',
              '  readonly launchGate: string | undefined;\n  readonly resultFile: string | undefined;\n',
              1,
          )
          w = w.replace(
              '    launchGate: entries.get("launch-gate"),\n',
              '    launchGate: entries.get("launch-gate"),\n    resultFile: entries.get("result-file"),\n',
              1,
          )
          marker = 'async function waitForLaunchGate(path: string): Promise<void> {\n'
          emit = '''function emitResult(result: WorkerResult, path: string | undefined): void {\n  const json = JSON.stringify(result);\n  if (path === undefined) {\n    console.log(json);\n    return;\n  }\n  writeFileSync(path, json, "utf8");\n}\n\nasync function waitForLaunchGate(path: string): Promise<void> {\n'''
          if marker not in w:
              raise SystemExit('waitForLaunchGate marker not found')
          w = w.replace(marker, emit, 1)
          new_w.write_text(w)

          f = new_f.read_text().replace('CP4-AQ1C', 'CP4-AQ1D').replace('cp4aq1c', 'cp4aq1d')
          f += '''\n\n## AQ1D result-file IPC correction\n\nAQ1C did not complete: after its correctness probe and 2/2 launcher probe both passed, the full run again reached `static-memory` and then observed a successful child process with no parseable stdout result before the final dataset/completion marker. AQ1C therefore created no authoritative timed calibration result.\n\nAQ1D preserves AQ1C's workloads, 8x8 mirrored block structure, 64 samples/source/cell, fixed CPU affinity, HIGH priority, launch gate, estimator, bootstrap procedure, and readiness criteria. It changes only post-measurement worker-result transport:\n\n- timed workers receive a unique `--result-file` path;\n- after correctness and measurement are complete, the worker serializes its `WorkerResult` with synchronous `writeFileSync`;\n- the parent reads that file synchronously only after the worker exits successfully;\n- redirected stdout is no longer the authoritative result channel;\n- stderr remains captured for diagnostics;\n- result files are deleted after each worker;\n- result-file writing occurs after the measured interval and is not part of the metric.\n\nBefore the first full AQ1D timed run, `--launcher-probe` is an infrastructure-only 16-worker IPC stress probe: eight `static-only-raw` and eight `static-memory` workers, alternating A/B worktrees, all through the exact gated, pinned, HIGH-priority, result-file path. Probe metrics are discarded and cannot be used as Gelis performance evidence.\n'''
          new_f.write_text(f)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq1d-hardened-stability-calibration.mts bench/runtime/cp4aq1d-hardened-stability-calibration-worker.mts docs/benchmarks/competitive-cp4aq1d-hardened-stability-calibration-freeze.md
      - name: Commit AQ1D
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bench(competitive): add CP4-AQ1D result-file IPC"
          git push
