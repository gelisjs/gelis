name: P11-G6 Route Timeout Candidate

# Retry after correcting the source import anchor.
on:
  push:
    branches:
      - work/p11-g6-route-timeout
    paths:
      - .github/workflows/p11-g6-route-timeout-candidate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply G6 route timeout integration
        run: python scripts/p11-g6-route-timeout-patch.py

      - name: Format G6 files
        run: |
          bunx prettier --write src/route.ts src/runtime/types.ts src/runtime/route-boundary.ts src/route-builder.ts src/app.ts src/timeout/application.ts src/timeout/index.ts src/timeout/route-policy.ts test/runtime/timeout-route.test.ts

      - name: Targeted timeout tests
        run: |
          bun test test/runtime/timeout-core.test.ts test/runtime/timeout-application.test.ts test/runtime/timeout-route.test.ts

      - name: Full quality gate
        run: bun run check

      - name: Commit candidate and remove temporary generator
        run: |
          git rm .github/workflows/p11-g6-route-timeout-candidate.yml scripts/p11-g6-route-timeout-patch.py
          git add src/route.ts src/runtime/types.ts src/runtime/route-boundary.ts src/route-builder.ts src/app.ts src/timeout/application.ts src/timeout/index.ts src/timeout/route-policy.ts test/runtime/timeout-route.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+rigenttio@users.noreply.github.com"
          git commit -m "feat(timeout): complete G6 route deadline boundary"
          git push origin HEAD:work/p11-g6-route-timeout
