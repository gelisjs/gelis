name: CP4-AJ Source Prepare

on:
  push:
    branches:
      - work/cp4aj-lazy-kind-primary-source
    paths:
      - .cp4aj-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/cp4aj-lazy-kind-primary-source
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Compose CP4-AI lazy capability with KIND-primary dispatch
        run: python .github/scripts/cp4aj_compose_kind_primary.py
      - name: Format candidate source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(router): compose lazy capability with kind-primary dispatch"
          git push origin HEAD:work/cp4aj-lazy-kind-primary-source
