name: CP4-A Evidence Formatter

on:
  push:
    branches:
      - work/competitive-cp4a-full-url-offset-viability

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'CP4A_EVIDENCE_FORMAT'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4a-full-url-offset-viability
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format evidence
        run: |
          bunx prettier --write docs/benchmarks/competitive-cp4a-local-authoritative.md
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/benchmarks/competitive-cp4a-local-authoritative.md
            git commit -m "docs(competitive): format CP4-A authoritative evidence"
            git push origin HEAD:work/competitive-cp4a-full-url-offset-viability
          fi
      - name: Full quality
        run: bun run check
      - name: Source guard
        run: git diff --quiet af4e5102046def1b163435333563b8d08f919bf5 HEAD -- src
