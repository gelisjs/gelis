name: CP3-W Evidence Formatter

on:
  push:
    branches:
      - work/competitive-cp3w-http-revalidation

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'CP3W_EVIDENCE_FORMAT'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format evidence
        run: bun ./node_modules/prettier/bin/prettier.cjs docs/benchmarks/competitive-cp3w-local-authoritative.md --write

      - name: Commit formatted evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp3w-local-authoritative.md
          git commit -m "docs(competitive): format CP3-W authoritative evidence"
          git push
