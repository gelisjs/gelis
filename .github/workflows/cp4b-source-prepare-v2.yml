name: CP4-B Source Prepare v2

on:
  push:
    branches:
      - work/competitive-cp4b-production-url-offset

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'CP4B_SOURCE_PREPARE_V2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4b-production-url-offset
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Reapply CP4-B candidate source
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          workflow = Path('.github/workflows/cp4b-source-prepare.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'cp4b-source-prepare-embedded.py', 'exec'))
          app_path = Path('src/app.ts')
          app = app_path.read_text()
          needle = "      matched = matchRequestUrl.call(router, method, request.url);\n"
          insertion = needle + "\n      if (matched === undefined) {\n        matched = matchRequestUrl.call(router, ALL_ROUTE_METHOD, request.url);\n      }\n"
          if app.count(needle) != 1:
              raise SystemExit('CP4-B ALL fallback app anchor mismatch')
          app_path.write_text(app.replace(needle, insertion, 1))
          PYTHON
      - name: Format candidate source and tests
        run: bunx prettier --write src/runtime/router.ts src/app.ts test/runtime/url-offset-routing.test.ts
      - name: Full quality
        run: bun run check
      - name: Commit frozen source candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/router.ts src/app.ts test/runtime/url-offset-routing.test.ts
          git commit -m "perf(runtime): add production request URL offset routing"
          git push origin HEAD:work/competitive-cp4b-production-url-offset
