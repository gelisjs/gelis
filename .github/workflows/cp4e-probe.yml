name: CP4-E Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4e-deferred-trailing-metadata

jobs:
  probe:
    if: github.event.head_commit.message == 'CP4E_PROBE_TRIGGER'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4e-deferred-trailing-metadata
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-E correctness probe only
        run: bun bench/runtime/cp4e-deferred-trailing-metadata-acceptance.mts --probe-only
