name: CP4-Q Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4q-deferred-upper-bound-dispatch
    paths:
      - .cp4q-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4q-deferred-upper-bound-dispatch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Restore exact CP4-I router source
        run: git show c18f231374d0008b7cc3e01bacbf9f81aff9a273:src/runtime/router.ts > src/runtime/router.ts
      - name: Apply deferred upper-bound dispatch transform
        run: python .github/scripts/cp4q_deferred_upper_bound_dispatch.py
      - name: Format source
        run: bunx prettier --write src/runtime/router.ts
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts
          git commit -m "perf(runtime): defer mixed upper-bound dispatch"
          git push origin HEAD:work/competitive-cp4q-deferred-upper-bound-dispatch
