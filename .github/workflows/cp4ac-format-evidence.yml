name: CP4-AC Format Evidence

on:
  push:
    branches:
      - work/competitive-cp4ac-production-z-ab-attribution
    paths:
      - .cp4ac-format-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ac-production-z-ab-attribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Format evidence
        run: bunx prettier --write docs/benchmarks/competitive-cp4ab-local-authoritative.md
      - name: Commit evidence formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp4ab-local-authoritative.md
          git commit -m "docs(bench): format CP4-AB authoritative evidence"
          git push origin HEAD:work/competitive-cp4ac-production-z-ab-attribution
