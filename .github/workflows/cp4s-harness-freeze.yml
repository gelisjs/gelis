name: CP4-S Harness Freeze

on:
  push:
    branches:
      - work/competitive-cp4s-all-url-fallback-specialization
    paths:
      - .cp4s-harness-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4s-all-url-fallback-specialization
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-S permanent artifacts
        run: python .github/scripts/cp4s_harness_generate.py
      - name: Format artifacts
        run: bunx prettier --write bench/runtime/cp4s-all-url-fallback-specialization-acceptance.mts bench/runtime/cp4s-all-url-fallback-specialization-worker.mts docs/benchmarks/competitive-cp4s-all-url-fallback-specialization-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4s-all-url-fallback-specialization-acceptance.mts bench/runtime/cp4s-all-url-fallback-specialization-worker.mts docs/benchmarks/competitive-cp4s-all-url-fallback-specialization-freeze.md
          git commit -m "bench(competitive): freeze CP4-S ALL URL fallback specialization viability"
          git push origin HEAD:work/competitive-cp4s-all-url-fallback-specialization
