name: Competitive CP2 Acceptance Prettier

on:
  push:
    branches:
      - diag/competitive-cp2-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: work/competitive-cp2-core-crown
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Format CP2 acceptance report
        run: bunx prettier docs/benchmarks/competitive-cp2-acceptance.md --write

      - name: Commit formatted report
        shell: bash
        run: |
          if git diff --quiet -- docs/benchmarks/competitive-cp2-acceptance.md; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "Rigent"
          git config user.email "127601320+rigenttio@users.noreply.github.com"
          git add docs/benchmarks/competitive-cp2-acceptance.md
          git commit -m "style(competitive): format CP2 acceptance"
          git push origin HEAD:work/competitive-cp2-core-crown
