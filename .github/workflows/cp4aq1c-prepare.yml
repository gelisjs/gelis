name: CP4-AQ1C prepare

on:
  push:
    branches:
      - work/competitive-cp4aq1c-gated-launcher-stability-calibration

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Transform AQ1B into AQ1C
        shell: python
        run: |
          from pathlib import Path
          import re

          old_h = Path('bench/runtime/cp4aq1b-hardened-stability-calibration.mts')
          old_w = Path('bench/runtime/cp4aq1b-hardened-stability-calibration-worker.mts')
          old_f = Path('docs/benchmarks/competitive-cp4aq1b-hardened-stability-calibration-freeze.md')
          new_h = Path('bench/runtime/cp4aq1c-hardened-stability-calibration.mts')
          new_w = Path('bench/runtime/cp4aq1c-hardened-stability-calibration-worker.mts')
          new_f = Path('docs/benchmarks/competitive-cp4aq1c-hardened-stability-calibration-freeze.md')

          old_h.rename(new_h)
          old_w.rename(new_w)
          old_f.rename(new_f)

          h = new_h.read_text()
          h = h.replace('CP4-AQ1B', 'CP4-AQ1C').replace('cp4aq1b', 'cp4aq1c')
          h = h.replace(
              'const probeOnly = process.argv.includes("--probe-only");\n',
              'const probeOnly = process.argv.includes("--probe-only");\nconst launcherProbeOnly = process.argv.includes("--launcher-probe");\n',
              1,
          )
          h = h.replace(
              'let probeCompleted = false;\nlet completed = false;\n',
              'let probeCompleted = false;\nlet launcherProbeCompleted = false;\nlet completed = false;\n',
              1,
          )
          h = h.replace(
              '''  if (probeOnly) {\n    runProbe();\n    probeCompleted = true;\n  } else {\n    runTiming();\n    completed = true;\n  }\n''',
              '''  if (probeOnly) {\n    runProbe();\n    probeCompleted = true;\n  } else if (launcherProbeOnly) {\n    runLauncherProbe();\n    launcherProbeCompleted = true;\n  } else {\n    runTiming();\n    completed = true;\n  }\n''',
              1,
          )
          h = h.replace(
              '''} else if (completed) {\n  console.log();\n  console.log("CP4-AQ1C LOCAL HARDENED STABILITY CALIBRATION RUN: COMPLETE");\n}\n''',
              '''} else if (launcherProbeCompleted) {\n  console.log();\n  console.log("CP4-AQ1C WINDOWS LAUNCHER PROBE: PASS (2/2)");\n} else if (completed) {\n  console.log();\n  console.log("CP4-AQ1C LOCAL HARDENED STABILITY CALIBRATION RUN: COMPLETE");\n}\n''',
              1,
          )
          h = h.replace(
              '''  if (probeOnly) {\n    console.log("Mode:            correctness probe only");\n  } else {\n''',
              '''  if (probeOnly) {\n    console.log("Mode:            correctness probe only");\n  } else if (launcherProbeOnly) {\n    console.log("Mode:            Windows launcher infrastructure probe only");\n    console.log(\n      `Windows affinity: logical CPU ${affinityLogicalCpu} (0x${affinityMaskHex})`,\n    );\n    console.log("Worker priority: HIGH");\n  } else {\n''',
              1,
          )
          marker = 'function runTiming(): void {\n'
          smoke = '''function runLauncherProbe(): void {\n  const hotpath = runWorker("static-only-raw", "a", false);\n  if (hotpath.probeOnly || hotpath.metric === null || hotpath.unit !== "ns/op") {\n    throw new Error("Invalid AQ1C hotpath launcher probe result");\n  }\n  console.log("PASS pinned-high-priority-worker static-only-raw");\n\n  const memory = runWorker("static-memory", "b", false);\n  if (memory.probeOnly || memory.metric === null || memory.unit !== "bytes") {\n    throw new Error("Invalid AQ1C memory launcher probe result");\n  }\n  console.log("PASS pinned-high-priority-worker static-memory");\n}\n\nfunction runTiming(): void {\n'''
          if marker not in h:
              raise SystemExit('runTiming marker not found')
          h = h.replace(marker, smoke, 1)

          launcher_pattern = re.compile(r'function spawnPinnedWindowsWorker\(args: readonly string\[\]\) \{.*?\n\}\n\nfunction workerOptions\(\)', re.S)
          launcher = '''function spawnPinnedWindowsWorker(args: readonly string[]) {\n  const bunPath = quotePowerShell(process.execPath);\n  const argumentList = args.map(quotePowerShell).join(", ");\n  const command = [\n    "$ErrorActionPreference = 'Stop'",\n    "$out = [IO.Path]::GetTempFileName()",\n    "$err = [IO.Path]::GetTempFileName()",\n    "$gate = [IO.Path]::GetTempFileName()",\n    "Remove-Item -LiteralPath $gate -Force -ErrorAction SilentlyContinue",\n    `try { $arguments = @(${argumentList}); $arguments += ('--launch-gate=' + $gate); $p = Start-Process -FilePath ${bunPath} -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err`,\n    "Start-Sleep -Milliseconds 25",\n    "$p.Refresh()",\n    `$p.ProcessorAffinity = [IntPtr]0x${affinityMaskHex}`,\n    "$p.PriorityClass = 'High'",\n    "[IO.File]::WriteAllText($gate, 'go')",\n    "$p.WaitForExit()",\n    "$code = $p.ExitCode",\n    "for ($i = 0; $i -lt 200; $i++) { $outLength = if (Test-Path $out) { (Get-Item -LiteralPath $out).Length } else { 0 }; $errLength = if (Test-Path $err) { (Get-Item -LiteralPath $err).Length } else { 0 }; if ($outLength -gt 0 -or $errLength -gt 0 -or $code -ne 0) { break }; Start-Sleep -Milliseconds 10 }",\n    "if (Test-Path $out) { [Console]::Out.Write([IO.File]::ReadAllText($out)) }",\n    "if (Test-Path $err) { [Console]::Error.Write([IO.File]::ReadAllText($err)) }",\n    "exit $code } finally { Remove-Item -LiteralPath $out,$err,$gate -Force -ErrorAction SilentlyContinue }",\n  ].join("; ");\n\n  return spawnSync(\n    "powershell.exe",\n    ["-NoLogo", "-NoProfile", "-NonInteractive", "-Command", command],\n    workerOptions(),\n  );\n}\n\nfunction workerOptions()'''
          h, count = launcher_pattern.subn(launcher, h, count=1)
          if count != 1:
              raise SystemExit(f'launcher replacement count={count}')
          new_h.write_text(h)

          w = new_w.read_text()
          w = w.replace('import { join } from "node:path";\n', 'import { readFileSync } from "node:fs";\nimport { join } from "node:path";\n', 1)
          gate_marker = 'const probeOnly = args.probeOnly === "true";\n\nconst appPath = join(sourceRoot, "src/app.ts");\n'
          gate_insert = '''const probeOnly = args.probeOnly === "true";\nconst launchGate = args.launchGate;\nif (launchGate !== undefined) {\n  await waitForLaunchGate(launchGate);\n}\n\nconst appPath = join(sourceRoot, "src/app.ts");\n'''
          if gate_marker not in w:
              raise SystemExit('worker gate marker not found')
          w = w.replace(gate_marker, gate_insert, 1)
          read_args_marker = 'function readArgs(values: readonly string[]): Record<string, string> {\n'
          gate_fn = '''async function waitForLaunchGate(path: string): Promise<void> {\n  const deadline = Date.now() + 10_000;\n  while (Date.now() < deadline) {\n    try {\n      if (readFileSync(path, "utf8") === "go") return;\n    } catch {\n      // Parent creates the gate only after affinity and priority are applied.\n    }\n    await Bun.sleep(2);\n  }\n  throw new Error(`launch gate timeout: ${path}`);\n}\n\nfunction readArgs(values: readonly string[]): Record<string, string> {\n'''
          if read_args_marker not in w:
              raise SystemExit('readArgs marker not found')
          w = w.replace(read_args_marker, gate_fn, 1)
          new_w.write_text(w)

          f = new_f.read_text().replace('CP4-AQ1B', 'CP4-AQ1C').replace('cp4aq1b', 'cp4aq1c')
          f += '''\n\n## AQ1C launcher correction\n\nAQ1B did not complete: the PowerShell launcher returned exit status `0` but an empty stdout capture for a `static-memory` worker before the final dataset and completion marker were produced. Therefore AQ1B created no authoritative timed calibration result.\n\nAQ1C preserves AQ1B's frozen workloads, block structure, sample counts, estimators, bootstrap procedure, and readiness criteria. It changes only launcher infrastructure:\n\n- timed workers receive a unique launch-gate path;\n- the worker waits at the gate before importing Gelis source or preparing the workload;\n- the parent starts the worker, applies logical-CPU affinity and `HIGH` priority, and only then writes `go` to the gate;\n- after process exit, stdout/stderr capture receives up to `2,000 ms` grace for redirected-file visibility before it is read;\n- temporary stdout, stderr, and gate files are removed after every worker.\n\nBefore the first full timed AQ1C run, `--launcher-probe` may be run once on the authoritative local host. It executes one `static-only-raw` worker and one `static-memory` worker through the exact final gated launcher. Their metrics are discarded and are infrastructure-only; they are not Gelis performance evidence. A failed launcher probe is not a timed calibration run.\n'''
          new_f.write_text(f)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq1c-hardened-stability-calibration.mts bench/runtime/cp4aq1c-hardened-stability-calibration-worker.mts docs/benchmarks/competitive-cp4aq1c-hardened-stability-calibration-freeze.md
      - name: Commit AQ1C
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bench(competitive): add CP4-AQ1C gated Windows launcher"
          git push
