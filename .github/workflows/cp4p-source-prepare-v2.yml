name: CP4-P Source Prepare v2

on:
  push:
    branches:
      - work/competitive-cp4p-mixed-positive-packed-state
    paths:
      - .cp4p-source-v2-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4p-mixed-positive-packed-state
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply mixed-positive packed-state transform
        run: python .github/scripts/cp4p_mixed_positive_packed_state.py
      - name: Format changed files
        run: bunx prettier --write src/runtime/router.ts docs/benchmarks/competitive-cp4o-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts docs/benchmarks/competitive-cp4o-local-authoritative.md
          git commit -m "perf(runtime): favor mixed lane in packed fast-map state"
          git push origin HEAD:work/competitive-cp4p-mixed-positive-packed-state
