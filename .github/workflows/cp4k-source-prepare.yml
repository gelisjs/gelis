name: CP4-K Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4k-static-only-handoff
    paths:
      - .cp4k-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4k-static-only-handoff
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply CP4-K source transform
        run: python .github/scripts/cp4k_static_only_handoff.py
      - name: Format source
        run: bunx prettier --write src/runtime/router.ts docs/benchmarks/competitive-cp4j-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit CP4-K source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts docs/benchmarks/competitive-cp4j-local-authoritative.md
          git diff --cached --quiet && exit 0
          git commit -m "perf(router): test static-only request handoff"
          git push origin HEAD:work/competitive-cp4k-static-only-handoff
