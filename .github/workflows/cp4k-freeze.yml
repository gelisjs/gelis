name: CP4-K Freeze

on:
  push:
    branches:
      - work/competitive-cp4k-static-only-handoff
    paths:
      - .cp4k-freeze-trigger

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4k-static-only-handoff
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Generate CP4-K artifacts
        run: python .github/scripts/cp4k_freeze.py
      - name: Format artifacts
        run: bunx prettier --write bench/runtime/cp4k-static-only-handoff-acceptance.mts bench/runtime/cp4k-static-only-handoff-worker.mts docs/benchmarks/competitive-cp4k-static-only-handoff-freeze.md
      - name: Full quality
        run: bun run check
      - name: Commit frozen CP4-K artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/runtime/cp4k-static-only-handoff-acceptance.mts bench/runtime/cp4k-static-only-handoff-worker.mts docs/benchmarks/competitive-cp4k-static-only-handoff-freeze.md
          git diff --cached --quiet && exit 0
          git commit -m "bench(competitive): freeze CP4-K static-only handoff"
          git push origin HEAD:work/competitive-cp4k-static-only-handoff
