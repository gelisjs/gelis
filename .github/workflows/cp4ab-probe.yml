name: CP4-AB Correctness Probe

on:
  push:
    branches:
      - work/competitive-cp4ab-dead-routing-metadata-elimination

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, 'CP4AB_PROBE_TRIGGER')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4ab-dead-routing-metadata-elimination
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: CP4-AB correctness probe only
        run: bun bench/runtime/cp4ab-dead-routing-metadata-production-acceptance.mts --probe-only
