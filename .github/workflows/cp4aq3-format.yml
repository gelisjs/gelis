name: CP4-AQ3 format

on:
  push:
    branches:
      - work/competitive-cp4aq3-production-performance-decision-protocol
    paths:
      - .github/workflows/cp4aq3-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write bench/runtime/cp4aq3-production-performance-decision.mts docs/benchmarks/competitive-cp4aq3-production-performance-decision-freeze.md
      - run: bun run typecheck:bench
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/runtime/cp4aq3-production-performance-decision.mts docs/benchmarks/competitive-cp4aq3-production-performance-decision-freeze.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(competitive): format CP4-AQ3 artifacts"
          git push