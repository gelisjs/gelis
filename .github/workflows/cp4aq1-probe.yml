name: CP4-AQ1 correctness probe

on:
  push:
    branches:
      - work/competitive-cp4aq1-hardened-stability-calibration

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run CP4-AQ1 correctness probe
        run: bun bench/runtime/cp4aq1-hardened-stability-calibration.mts --probe-only
