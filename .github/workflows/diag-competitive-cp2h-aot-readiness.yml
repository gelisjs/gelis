name: Competitive CP2-H AOT Readiness Diagnostic

on:
  push:
    branches:
      - diag/competitive-cp2h-aot-readiness

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: work/competitive-cp2-core-crown
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install frozen Elysia AOT island
        run: bun install --cwd bench/competitive/elysia-v2-aot --frozen-lockfile

      - name: Build CP2-H AOT artifacts
        working-directory: bench/competitive/elysia-v2-aot
        run: bun http-aot-build.mts

      - name: Inspect static-raw 5k artifact route table
        shell: bash
        working-directory: bench/competitive/elysia-v2-aot
        run: |
          set +e
          PORT=3112 bun generated/cp2-http/static-raw/server.js >/tmp/cp2h-aot.out 2>/tmp/cp2h-aot.err &
          pid=$!
          echo "pid=$pid"
          sleep 1
          ps -p "$pid" -o pid,stat,etime,cmd
          ss -ltnp | grep -E '(:3112|:3100)' || true
          for path in /r/0 /r/1 /r/2 /r/3 /r/4 /r/99 /r/999 /r/4999; do
            echo "--- ${path} ---"
            curl -sS -D - --max-time 2 "http://127.0.0.1:3112${path}" -o /tmp/cp2h-body || true
            cat /tmp/cp2h-body 2>/dev/null || true
            echo
          done
          echo "artifact route/string diagnostics:"
          grep -aoE '/r/(0|1|2|3|4|99|999|4999)' generated/cp2-http/static-raw/server.js | sort | uniq -c || true
          echo "artifact size:"
          wc -c generated/cp2-http/static-raw/server.js
          echo "stdout:"
          cat /tmp/cp2h-aot.out || true
          echo "stderr:"
          cat /tmp/cp2h-aot.err || true
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
