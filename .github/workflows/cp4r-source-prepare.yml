name: CP4-R Source Prepare

on:
  push:
    branches:
      - work/competitive-cp4r-upper-bound-sentinel-dispatch
    paths:
      - .cp4r-source-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/competitive-cp4r-upper-bound-sentinel-dispatch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Restore exact CP4-Q candidate router
        run: git show b268a99f58e6c055ed0255c30ea16783f85fb5f3:src/runtime/router.ts > src/runtime/router.ts
      - name: Apply upper-bound sentinel dispatch transform
        run: python .github/scripts/cp4r_upper_bound_sentinel_dispatch.py
      - name: Format changed source and CP4-Q evidence
        run: bunx prettier --write src/runtime/router.ts docs/benchmarks/competitive-cp4q-local-authoritative.md
      - name: Full quality
        run: bun run check
      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/router.ts docs/benchmarks/competitive-cp4q-local-authoritative.md
          git commit -m "perf(runtime): use static upper bound as dispatch sentinel"
          git push origin HEAD:work/competitive-cp4r-upper-bound-sentinel-dispatch
