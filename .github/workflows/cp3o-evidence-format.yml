name: CP3-O Evidence Format

on:
  push:
    branches:
      - work/competitive-cp3o-trailing-radix-viability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format evidence
        run: bun ./node_modules/prettier/bin/prettier.cjs docs/benchmarks/competitive-cp3o-local-authoritative.md --write

      - name: Commit formatted evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Evidence already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/benchmarks/competitive-cp3o-local-authoritative.md
            git commit -m "chore(competitive): format CP3-O evidence"
            git push
          fi

      - name: Run full repository quality gate
        run: bun run check
