name: CP4-AR memory probe

on:
  push:
    branches:
      - work/competitive-cp4ar-collision-memory-gate
    paths:
      - .github/workflows/cp4ar-memory-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun bench/runtime/cp4ar-collision-memory-gate.mts --probe-only
