name: P11-G10 run repaired generator

on:
  push:
    branches:
      - work/p11-g10-request-id-enabled-acceptance
    paths:
      - .github/workflows/p11-g10-run-fixed-generator.yml

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/p11-g10-request-id-enabled-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Extract and run repaired generator step
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p11-g10-generate-harness.yml').read_text()
          start_marker = '      - name: Generate G10 harness from frozen reference design\n        run: |\n'
          end_marker = '      - name: Format generated harness\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              'text, count = pattern.subn(replacement, text, count=1)',
              'text, count = pattern.subn(lambda _match: replacement, text, count=1)',
              1,
          )
          Path('/tmp/p11-g10-generate.sh').write_text(script)
          PY
          mkdir -p bench/request-id-timeout
          bash /tmp/p11-g10-generate.sh
      - name: Format generated harness
        run: bunx prettier@3.9.6 --write bench/request-id-timeout/p11-g10-request-id-acceptance.mts bench/request-id-timeout/p11-g10-request-id-worker.mts bench/request-id-timeout/p11-g10-request-id-http-server.mts
      - name: Run full quality gates
        run: bun run check
      - name: Commit benchmark-only candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/request-id-timeout/p11-g10-request-id-acceptance.mts bench/request-id-timeout/p11-g10-request-id-worker.mts bench/request-id-timeout/p11-g10-request-id-http-server.mts
          git commit -m "bench(request-id): add P11-G10 Hono and HTTP acceptance"
          git push origin HEAD:work/p11-g10-request-id-enabled-acceptance