name: P11-G1 Prettier Diagnostic

on:
  push:
    branches:
      - diag/p11-g1-prettier

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply authoritative Prettier output to G1
        run: |
          git fetch origin work/p11-g1-request-id-timeout-freeze
          git checkout -B work/p11-g1-request-id-timeout-freeze origin/work/p11-g1-request-id-timeout-freeze
          bunx prettier docs/architecture/p11-g-request-id-timeout-capability-freeze.md --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/p11-g-request-id-timeout-capability-freeze.md
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style(docs): format P11-G1 freeze"
          git push origin HEAD:work/p11-g1-request-id-timeout-freeze
