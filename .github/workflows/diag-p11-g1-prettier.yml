name: P11-G1 Prettier Diagnostic

on:
  push:
    branches:
      - diag/p11-g1-prettier

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Show authoritative Prettier diff
        run: |
          bunx prettier docs/architecture/p11-g-request-id-timeout-capability-freeze.md --write
          git diff -- docs/architecture/p11-g-request-id-timeout-capability-freeze.md
