name: P11-G12 Acceptance Prettier

on:
  push:
    branches:
      - diag/p11-g12-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Checkout target branch
        run: git switch work/p11-g12-request-id-timeout-acceptance
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier
        run: bunx prettier docs/architecture/p11-g-request-id-timeout-acceptance.md --write
      - name: Commit formatted document
        shell: bash
        run: |
          git diff --check
          git config user.name "Rigent"
          git config user.email "127601320+rigenttio@users.noreply.github.com"
          git add docs/architecture/p11-g-request-id-timeout-acceptance.md
          git commit -m "style(p11-g): format acceptance document"
          git push origin HEAD:work/p11-g12-request-id-timeout-acceptance
